              static String textReport(String t) {
                  StringBuilder sb = new StringBuilder();
                  int words = t.trim().isEmpty() ? 0 : t.trim().split("\\s+").length;
                  sb.append("Символов: ").append(t.length()).append(" · без пробелов: ").append(t.replaceAll("\\s", "").length())
                          .append(" · слов: ").append(words).append("\n");
                  for (int n = 1; n <= 3; n++) {
                      sb.append("\n").append(n == 1 ? "Слова" : n == 2 ? "Пары слов" : "Тройки слов").append(":\n");
                      for (Map.Entry<String, Integer> e : SeoCore.wordFreq(t, n, 15)) {
                          double pct = words == 0 ? 0 : 100.0 * e.getValue() * n / words;
                          sb.append(String.format(Locale.ROOT, "%4d  %5.2f%%  ", e.getValue(), pct)).append(e.getKey()).append('\n');
                      }
                  }
                  return sb.toString();
              }

