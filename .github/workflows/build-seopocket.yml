              }

              /** True if the keyword contains any minus word (whole word or word start, case-insensitive). */
              public static boolean hasMinus(String keyword, List<String> minus) {
                  if (minus.isEmpty()) return false;
                  String[] words = normKeyword(keyword).split("[\\s\\-/]+");
                  for (String m : minus) {
                      String mm = normKeyword(m);
                      if (mm.isEmpty()) continue;
                      if (mm.contains(" ")) { if (normKeyword(keyword).contains(mm)) return true; continue; }
                      boolean stem = mm.endsWith("*") || mm.length() >= 4;   // "безкоштовн" matches all forms, "бу" only the word "бу"
                      String base = mm.replace("*", "");
                      for (String w : words) if (stem ? w.startsWith(base) : w.equals(base)) return true;
                  }
                  return false;
