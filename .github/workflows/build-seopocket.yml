              void runAudit() {
                  final String url = Net.normalizeUrl(auditUrl.getText().toString());
                  final String key = auditKey.getText().toString().trim();
                  if (url.isEmpty()) { toast("Введите адрес"); return; }
                  auditOut.setText("Проверяю " + url + " …");
                  bg(new Runnable() { @Override public void run() {
                      final String report = audit(url, key);
                      ui(new Runnable() { @Override public void run() { auditOut.setText(report); } });
                  } });
              }

              static String ok(boolean good) { return good ? "✓ " : "✗ "; }
              static String lenMark(int len, int min, int max) { return len == 0 ? "✗ " : (len < min || len > max) ? "⚠ " : "✓ "; }

              String audit(String url, String key) {
                  StringBuilder r = new StringBuilder();
                  List<Net.Resp> chain = Net.chain(url, 10, true);
                  Net.Resp fin = chain.get(chain.size() - 1);
                  r.append("■ ОТВЕТ СЕРВЕРА\n");
                  if (fin.error != null) { r.append("✗ Ошибка: ").append(fin.error).append('\n'); return r.toString(); }
                  if (chain.size() > 1) {
                      r.append(chain.size() - 1 > 1 ? "⚠ " : "• ").append("Редиректов: ").append(chain.size() - 1).append('\n');
                      for (Net.Resp h : chain) r.append("   ").append(h.code).append("  ").append(h.url).append('\n');
                  }
                  r.append(ok(fin.code == 200)).append("Код ").append(fin.code).append(" · ").append(fin.ms).append(" мс · HTML ")
                          .append(kb(fin.bytesDecoded)).append('\n');
                  boolean gz = "gzip".equalsIgnoreCase(fin.contentEncoding) || fin.header("content-encoding") != null;
                  r.append(gz ? "✓ " : "⚠ ").append("Сжатие: ").append(fin.header("content-encoding") != null ? fin.header("content-encoding") : "нет")
                          .append(" (по сети ").append(kb(fin.bytesOnWire)).append(")\n");
                  r.append(fin.ms < 800 ? "✓ " : fin.ms < 2000 ? "⚠ " : "✗ ").append("Время ответа: ").append(fin.ms).append(" мс\n");
                  r.append(ok(fin.url.startsWith("https://"))).append("HTTPS\n");
                  String xr = fin.header("x-robots-tag");
                  if (xr != null) r.append(xr.toLowerCase(Locale.ROOT).contains("noindex") ? "✗ " : "• ").append("X-Robots-Tag: ").append(xr).append('\n');

                  SeoCore.Page p = SeoCore.analyze(fin.body, fin.url);
                  r.append("\n■ МЕТА\n");
                  int tl = p.title == null ? 0 : p.title.length();
                  r.append(lenMark(tl, 30, 65)).append("Title (").append(tl).append("): ").append(p.title == null ? "—" : p.title).append('\n');
                  int dl = p.description == null ? 0 : p.description.length();
                  r.append(lenMark(dl, 70, 160)).append("Description (").append(dl).append("): ").append(p.description == null ? "—" : p.description).append('\n');
                  r.append(p.h1.size() == 1 ? "✓ " : p.h1.isEmpty() ? "✗ " : "⚠ ").append("H1 (").append(p.h1.size()).append("): ")
                          .append(p.h1.isEmpty() ? "—" : join(p.h1.subList(0, Math.min(3, p.h1.size())), " | ")).append('\n');
                  if (p.canonical == null) r.append("⚠ Canonical: нет\n");
                  else {
                      String canon = Net.resolve(fin.url, p.canonical);
                      boolean self = canon.replaceAll("/$", "").equalsIgnoreCase(fin.url.replaceAll("/$", ""));
                      r.append(self ? "✓ " : "⚠ ").append("Canonical: ").append(canon).append(self ? " (на себя)" : " (на другую страницу)").append('\n');
                  }
                  boolean noindex = p.robotsMeta != null && p.robotsMeta.toLowerCase(Locale.ROOT).contains("noindex");
                  r.append(noindex ? "✗ " : "✓ ").append("Meta robots: ").append(p.robotsMeta == null ? "нет (индексируется)" : p.robotsMeta).append('\n');
                  r.append(p.lang != null ? "✓ " : "⚠ ").append("lang: ").append(p.lang == null ? "не указан" : p.lang).append('\n');
                  r.append(p.viewport != null ? "✓ " : "✗ ").append("Viewport (мобильная версия): ").append(p.viewport == null ? "нет" : p.viewport).append('\n');
                  if (p.favicon == null) r.append("⚠ Favicon не найден в <head>\n");

                  r.append("\n■ КОНТЕНТ\n");
                  r.append(p.words >= 300 ? "✓ " : "⚠ ").append("Слов на странице: ").append(p.words).append('\n');
                  r.append("• H2: ").append(p.h2.size()).append(", H3: ").append(p.h3.size()).append('\n');
                  for (int i = 0; i < Math.min(8, p.h2.size()); i++) r.append("   h2: ").append(p.h2.get(i)).append('\n');
                  r.append(p.imagesNoAlt == 0 ? "✓ " : "⚠ ").append("Картинок: ").append(p.images).append(", без alt: ").append(p.imagesNoAlt).append('\n');
                  for (String s : p.imagesNoAltSrc) r.append("   без alt: ").append(s).append('\n');
                  r.append("• Ссылки: внутренних ").append(p.linksInternal).append(", внешних ").append(p.linksExternal).append(", nofollow ").append(p.linksNofollow).append('\n');
                  r.append("• Скриптов: ").append(p.scripts).append(", CSS: ").append(p.styles).append(", iframe: ").append(p.iframes).append('\n');

                  r.append("\n■ МИКРОРАЗМЕТКА И СОЦСЕТИ\n");
                  r.append(p.schemaTypes.isEmpty() ? "⚠ Schema.org (JSON-LD): нет\n" : "✓ Schema.org: " + join(p.schemaTypes, ", ") + "\n");
                  r.append(p.ogTitle != null ? "✓ " : "⚠ ").append("Open Graph: ").append(p.ogTitle == null ? "нет og:title" : p.ogTitle)
                          .append(p.ogImage == null ? " · нет og:image" : " · есть og:image").append('\n');
                  if (p.twitterCard != null) r.append("• Twitter card: ").append(p.twitterCard).append('\n');
                  if (!p.hreflang.isEmpty()) {
                      r.append("✓ hreflang: ").append(p.hreflang.size()).append('\n');
                      for (String h : p.hreflang) r.append("   ").append(h).append('\n');
                  } else r.append("• hreflang: нет (для сайта на UA+RU стоит добавить)\n");

                  r.append("\n■ HTTP-ЗАГОЛОВКИ\n");
                  String[] hk = {"server", "content-type", "cache-control", "expires", "last-modified", "strict-transport-security", "content-security-policy", "x-frame-options", "vary"};
                  for (String h : hk) { String v = fin.header(h); if (v != null) r.append("• ").append(h).append(": ").append(v.length() > 90 ? v.substring(0, 90) + "…" : v).append('\n'); }
                  if (fin.header("strict-transport-security") == null && fin.url.startsWith("https")) r.append("⚠ Нет HSTS\n");

                  if (!key.isEmpty()) {
                      r.append("\n■ КЛЮЧ «").append(key).append("»\n");
                      r.append(ok(SeoCore.occurrences(p.title, key) > 0)).append("в Title: ").append(SeoCore.occurrences(p.title, key)).append('\n');
                      r.append(ok(SeoCore.occurrences(p.description, key) > 0)).append("в Description: ").append(SeoCore.occurrences(p.description, key)).append('\n');
                      r.append(ok(SeoCore.occurrences(join(p.h1, " "), key) > 0)).append("в H1: ").append(SeoCore.occurrences(join(p.h1, " "), key)).append('\n');
                      String slugKey = SeoCore.slug(SeoCore.translitUk(key));
                      r.append(fin.url.toLowerCase(Locale.ROOT).contains(slugKey) ? "✓ " : "• ").append("в URL (").append(slugKey).append(")\n");
                      int occ = SeoCore.occurrences(p.text, key);
                      double dens = p.words == 0 ? 0 : 100.0 * occ * key.split("\\s+").length / p.words;
                      r.append(dens > 0 && dens <= 3.5 ? "✓ " : dens > 3.5 ? "⚠ " : "✗ ").append("в тексте: ").append(occ)
                              .append(" раз · плотность ").append(String.format(Locale.ROOT, "%.2f%%", dens)).append('\n');
                  }
                  r.append("\n✓ хорошо · ⚠ стоит улучшить · ✗ проблема");
                  return r.toString();
              }

              // ================================================================ 3. BULK STATUS
              void pageBulk(LinearLayout p) {
                  LinearLayout c = card(p, "Массовая проверка URL", "Коды ответа и редиректы для списка адресов — удобно после переезда сайта или для проверки ссылок из sitemap.");
                  final EditText list = input(c, "Адреса, по одному в строке", true, "bulkList");
                  final TextView out = output(c);
                  LinearLayout br = buttonRow(c);
                  button(br, "▶ Проверить", new View.OnClickListener() { @Override public void onClick(View v) { runBulk(list.getText().toString(), out); } });
                  button(br, "Копировать", new View.OnClickListener() { @Override public void onClick(View v) { copy(out.getText().toString()); } });
                  button(br, "CSV → файл", new View.OnClickListener() { @Override public void onClick(View v) { saveFile("status.csv", "text/csv", out.getText().toString().replace("\t", ";")); } });
              }

              void runBulk(String text, final TextView out) {
                  final List<String> urls = new ArrayList<>();
                  for (String l : text.split("\\n")) if (!l.trim().isEmpty()) urls.add(Net.normalizeUrl(l));
                  if (urls.isEmpty()) { toast("Список пуст"); return; }
                  final String[] lines = new String[urls.size()];
                  final AtomicInteger left = new AtomicInteger(urls.size());
                  out.setText("Проверяю " + urls.size() + " адресов…");
                  for (int i = 0; i < urls.size(); i++) {
                      final int idx = i;
                      bg(new Runnable() { @Override public void run() {
                          List<Net.Resp> ch = Net.chain(urls.get(idx), 10, false);
                          Net.Resp f = ch.get(ch.size() - 1);
                          StringBuilder codes = new StringBuilder();
                          for (Net.Resp h : ch) { if (codes.length() > 0) codes.append("→"); codes.append(h.code < 0 ? "ERR" : String.valueOf(h.code)); }
                          lines[idx] = codes + "\t" + f.ms + "ms\t" + urls.get(idx) + (ch.size() > 1 ? "\t→ " + f.url : "") + (f.error != null ? "\t" + f.error : "");
                          final int l = left.decrementAndGet();
                          ui(new Runnable() { @Override public void run() {
                              StringBuilder sb = new StringBuilder(l > 0 ? "Осталось " + l + "\n" : "Готово\n");
                              sb.append("Коды\tВремя\tURL\tИтог\n");
                              for (String s : lines) if (s != null) sb.append(s).append('\n');
                              out.setText(sb.toString());
                          } });
                      } });
                  }
              }

