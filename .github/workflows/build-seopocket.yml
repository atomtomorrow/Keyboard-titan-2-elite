              /** Parses ["query",["s1","s2",...], ...] (Google / YouTube / Bing OpenSearch suggestion format). */
              public static List<String> parseSuggestJson(String body) {
                  List<String> out = new ArrayList<>();
                  if (body == null) return out;
                  int start = body.indexOf('[', body.indexOf('[') + 1);    // second "[" = the suggestions array
                  if (start < 0) return out;
                  int i = start + 1;
                  StringBuilder cur = null;
                  int depth = 1;
                  for (; i < body.length() && depth > 0; i++) {
                      char c = body.charAt(i);
                      if (cur != null) {
                          if (c == '\\' && i + 1 < body.length()) {
                              char n = body.charAt(++i);
                              if (n == 'u' && i + 4 < body.length()) {
                                  try { cur.append((char) Integer.parseInt(body.substring(i + 1, i + 5), 16)); } catch (Exception ignored) { }
                                  i += 4;
                              } else if (n == 'n') cur.append(' ');
                              else cur.append(n);
                          } else if (c == '"') {
                              if (depth == 1) out.add(cur.toString());
                              cur = null;
                          } else cur.append(c);
                      } else if (c == '"') cur = new StringBuilder();
                      else if (c == '[') depth++;
                      else if (c == ']') depth--;
                  }
                  return out;
              }

