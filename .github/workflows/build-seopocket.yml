              void runDomain(final String input, final TextView out) {
                  final String host = SeoCore.host(Net.normalizeUrl(input));
                  if (host.isEmpty()) { toast("Введите домен"); return; }
                  out.setText("Проверяю " + host + "…");
                  bg(new Runnable() { @Override public void run() {
                      StringBuilder sb = new StringBuilder("■ ").append(host).append("\n\n■ DNS\n");
                      try { for (InetAddress a : InetAddress.getAllByName(host)) sb.append("• ").append(a.getHostAddress()).append('\n'); }
                      catch (Exception e) { sb.append("✗ ").append(e.getMessage()).append('\n'); }
                      sb.append("\n■ SSL\n");
                      HttpsURLConnection c = null;
                      try {
                          c = (HttpsURLConnection) new java.net.URL("https://" + host + "/").openConnection();
                          c.setConnectTimeout(Net.timeoutMs);
                          c.setReadTimeout(Net.timeoutMs);
                          c.connect();
                          Certificate[] certs = c.getServerCertificates();
                          if (certs.length > 0 && certs[0] instanceof X509Certificate) {
                              X509Certificate x = (X509Certificate) certs[0];
                              long days = (x.getNotAfter().getTime() - System.currentTimeMillis()) / 86400000L;
                              sb.append(days > 20 ? "✓ " : days > 0 ? "⚠ " : "✗ ").append("Действует до ")
                                      .append(new SimpleDateFormat("dd.MM.yyyy", Locale.ROOT).format(x.getNotAfter())).append(" (").append(days).append(" дн.)\n");
                              sb.append("• Выдан: ").append(cn(x.getIssuerX500Principal().getName())).append('\n');
                              sb.append("• Для: ").append(cn(x.getSubjectX500Principal().getName())).append('\n');
                          }
                      } catch (Exception e) { sb.append("✗ ").append(e.getMessage()).append('\n'); }
                      finally { if (c != null) c.disconnect(); }
                      sb.append("\n■ РЕДИРЕКТЫ (должны вести в одну версию)\n");
                      String[] variants = {"http://" + host + "/", "http://www." + host + "/", "https://" + host + "/", "https://www." + host + "/"};
                      LinkedHashSet<String> finals = new LinkedHashSet<>();
                      for (String v : variants) {
                          List<Net.Resp> ch = Net.chain(v, 6, false);
                          Net.Resp f = ch.get(ch.size() - 1);
                          StringBuilder codes = new StringBuilder();
                          for (Net.Resp h : ch) { if (codes.length() > 0) codes.append("→"); codes.append(h.code < 0 ? "ERR" : String.valueOf(h.code)); }
                          sb.append("• ").append(v).append("  ").append(codes).append(ch.size() > 1 ? "  → " + f.url : "").append('\n');
                          if (f.code == 200) finals.add(f.url);
                      }
                      sb.append(finals.size() == 1 ? "✓ Все варианты ведут на " + finals.iterator().next() + "\n" : "⚠ Разные итоговые адреса: " + finals + " — настройте 301\n");
                      sb.append("\n■ РЕГИСТРАЦИЯ (RDAP)\n");
                      Net.Resp rd;
                      List<Net.Resp> rch = Net.chain("https://rdap.org/domain/" + host, 5, true);
                      rd = rch.get(rch.size() - 1);
                      try {
                          if (rd.code != 200 || rd.body == null) throw new Exception("нет данных RDAP (для .ua часто недоступно) — код " + rd.code);
                          JSONObject js = new JSONObject(rd.body);
                          JSONArray ev = js.optJSONArray("events");
                          if (ev != null) for (int i = 0; i < ev.length(); i++) {
                              JSONObject e = ev.getJSONObject(i);
                              String a = e.optString("eventAction"), d = e.optString("eventDate");
                              String name = a.equals("registration") ? "Зарегистрирован" : a.equals("expiration") ? "Истекает" : a.equals("last changed") ? "Изменён" : a;
                              sb.append("• ").append(name).append(": ").append(d.length() >= 10 ? d.substring(0, 10) : d).append('\n');
                          }
                          JSONArray ents = js.optJSONArray("entities");
                          if (ents != null) for (int i = 0; i < ents.length(); i++) {
                              JSONObject en = ents.getJSONObject(i);
                              JSONArray roles = en.optJSONArray("roles");
                              if (roles != null && roles.toString().contains("registrar")) {
                                  JSONArray v = en.optJSONArray("vcardArray");
                                  String fn = v != null ? v.toString().replaceAll(".*\"fn\",\\{\\},\"text\",\"([^\"]+)\".*", "$1") : en.optString("handle");
                                  sb.append("• Регистратор: ").append(fn.length() > 80 ? en.optString("handle") : fn).append('\n');
                              }
                          }
                          JSONArray ns = js.optJSONArray("nameservers");
                          if (ns != null) for (int i = 0; i < ns.length(); i++) sb.append("• NS: ").append(ns.getJSONObject(i).optString("ldhName")).append('\n');
                      } catch (Exception e) { sb.append("• ").append(e.getMessage()).append('\n'); }
                      final String s = sb.toString();
                      ui(new Runnable() { @Override public void run() { out.setText(s); } });
                  } });
              }

              static String cn(String dn) {
                  java.util.regex.Matcher m = java.util.regex.Pattern.compile("CN=([^,]+)").matcher(dn);
                  String o = m.find() ? m.group(1) : dn;
                  java.util.regex.Matcher m2 = java.util.regex.Pattern.compile("O=([^,]+)").matcher(dn);
                  return m2.find() ? o + " (" + m2.group(1) + ")" : o;
              }

