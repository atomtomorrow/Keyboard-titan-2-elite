                      }
                  });
                  return l.size() > max ? l.subList(0, max) : l;
              }

              static final java.util.Set<String> STOP = new java.util.HashSet<>(java.util.Arrays.asList(
                      "для", "или", "как", "что", "это", "все", "при", "без", "под", "над", "про", "его", "her", "the", "and", "for", "with",
                      "від", "або", "що", "які", "яка", "який", "чи", "так", "вже", "так", "щоб", "есть", "был", "как", "где", "чем"));

              // ===================================================================== HTML analysis
              public static final class Page {
                  public String title, description, robotsMeta, canonical, lang, viewport, charset, ogTitle, ogDescription, ogImage, twitterCard, favicon;
                  public final List<String> h1 = new ArrayList<>(), h2 = new ArrayList<>(), h3 = new ArrayList<>();
                  public final List<String> hreflang = new ArrayList<>(), schemaTypes = new ArrayList<>();
                  public int images, imagesNoAlt, linksInternal, linksExternal, linksNofollow, words, scripts, styles, iframes;
                  public final List<String> imagesNoAltSrc = new ArrayList<>();
                  public String text = "";
              }

              private static final int F = Pattern.CASE_INSENSITIVE | Pattern.DOTALL;

              public static String attr(String tag, String name) {
                  Matcher m = Pattern.compile("\\b" + name + "\\s*=\\s*(\"([^\"]*)\"|'([^']*)'|([^\\s>]+))", F).matcher(tag);
                  if (!m.find()) return null;
                  String v = m.group(2) != null ? m.group(2) : m.group(3) != null ? m.group(3) : m.group(4);
                  return decodeEntities(v).trim();
              }

              public static String decodeEntities(String s) {
                  if (s == null) return null;
                  s = s.replace("&amp;", "&").replace("&quot;", "\"").replace("&#39;", "'").replace("&apos;", "'")
                          .replace("&lt;", "<").replace("&gt;", ">").replace("&nbsp;", " ").replace("&laquo;", "«").replace("&raquo;", "»")
                          .replace("&mdash;", "—").replace("&ndash;", "–").replace("&hellip;", "…");
                  Matcher m = Pattern.compile("&#(x?)([0-9a-fA-F]+);").matcher(s);
                  StringBuffer sb = new StringBuffer();
                  while (m.find()) {
                      String rep;
                      try { rep = String.valueOf((char) Integer.parseInt(m.group(2), m.group(1).isEmpty() ? 10 : 16)); }
                      catch (Exception e) { rep = m.group(); }
                      m.appendReplacement(sb, Matcher.quoteReplacement(rep));
                  }
                  m.appendTail(sb);
                  return s.isEmpty() ? s : sb.toString();
              }

              static String stripTags(String html) {
                  return decodeEntities(html.replaceAll("(?is)<[^>]+>", " ")).replaceAll("\\s+", " ").trim();
              }

              public static String host(String url) {
                  Matcher m = Pattern.compile("^[a-z]+://([^/:?#]+)", Pattern.CASE_INSENSITIVE).matcher(url.trim());
                  return m.find() ? m.group(1).toLowerCase(Locale.ROOT).replaceFirst("^www\\.", "") : "";
              }

              public static Page analyze(String html, String pageUrl) {
                  Page p = new Page();
                  if (html == null) html = "";
                  String head = html;
                  Matcher t = Pattern.compile("<title[^>]*>(.*?)</title>", F).matcher(head);
                  if (t.find()) p.title = stripTags(t.group(1));
                  Matcher meta = Pattern.compile("<meta\\b[^>]*>", F).matcher(html);
                  while (meta.find()) {
                      String tag = meta.group();
                      String name = attr(tag, "name"), prop = attr(tag, "property"), content = attr(tag, "content");
                      String key = (name != null ? name : prop != null ? prop : "").toLowerCase(Locale.ROOT);
                      if (attr(tag, "charset") != null) p.charset = attr(tag, "charset");
                      if (content == null) continue;
                      switch (key) {
                          case "description": if (p.description == null) p.description = content; break;
                          case "robots": case "googlebot": p.robotsMeta = p.robotsMeta == null ? content : p.robotsMeta + ", " + content; break;
                          case "viewport": p.viewport = content; break;
                          case "og:title": p.ogTitle = content; break;
                          case "og:description": p.ogDescription = content; break;
                          case "og:image": p.ogImage = content; break;
                          case "twitter:card": p.twitterCard = content; break;
                          default: break;
                      }
                  }
                  Matcher link = Pattern.compile("<link\\b[^>]*>", F).matcher(html);
                  while (link.find()) {
                      String tag = link.group();
                      String rel = attr(tag, "rel");
                      if (rel == null) continue;
                      rel = rel.toLowerCase(Locale.ROOT);
                      if (rel.equals("canonical")) p.canonical = attr(tag, "href");
                      else if (rel.equals("alternate") && attr(tag, "hreflang") != null) p.hreflang.add(attr(tag, "hreflang") + " → " + attr(tag, "href"));
                      else if (rel.contains("icon") && p.favicon == null) p.favicon = attr(tag, "href");
                  }
                  Matcher htmlTag = Pattern.compile("<html\\b[^>]*>", F).matcher(html);
                  if (htmlTag.find()) p.lang = attr(htmlTag.group(), "lang");
                  for (int lvl = 1; lvl <= 3; lvl++) {
                      Matcher h = Pattern.compile("<h" + lvl + "\\b[^>]*>(.*?)</h" + lvl + ">", F).matcher(html);
                      List<String> dst = lvl == 1 ? p.h1 : lvl == 2 ? p.h2 : p.h3;
                      while (h.find()) dst.add(stripTags(h.group(1)));
                  }
                  Matcher img = Pattern.compile("<img\\b[^>]*>", F).matcher(html);
                  while (img.find()) {
                      p.images++;
                      String alt = attr(img.group(), "alt");
                      if (alt == null || alt.isEmpty()) {
                          p.imagesNoAlt++;
                          String src = attr(img.group(), "src");
                          if (src != null && p.imagesNoAltSrc.size() < 15) p.imagesNoAltSrc.add(src);
                      }
                  }
                  String myHost = host(pageUrl);
                  Matcher a = Pattern.compile("<a\\b[^>]*>", F).matcher(html);
                  while (a.find()) {
                      String href = attr(a.group(), "href");
                      if (href == null || href.startsWith("#") || href.startsWith("javascript:") || href.startsWith("mailto:") || href.startsWith("tel:")) continue;
                      String rel = attr(a.group(), "rel");
                      if (rel != null && rel.toLowerCase(Locale.ROOT).contains("nofollow")) p.linksNofollow++;
                      String h = host(href);
                      if (h.isEmpty() || h.equals(myHost)) p.linksInternal++; else p.linksExternal++;
                  }
                  Matcher ld = Pattern.compile("<script[^>]*application/ld\\+json[^>]*>(.*?)</script>", F).matcher(html);
                  while (ld.find()) {
                      Matcher ty = Pattern.compile("\"@type\"\\s*:\\s*(\"([^\"]+)\"|\\[([^\\]]+)\\])").matcher(ld.group(1));
                      while (ty.find()) {
                          String v = ty.group(2) != null ? ty.group(2) : ty.group(3).replace("\"", "").trim();
                          for (String one : v.split("\\s*,\\s*")) if (!p.schemaTypes.contains(one)) p.schemaTypes.add(one);
                      }
                  }
                  p.scripts = count(html, "<script\\b");
                  p.styles = count(html, "<link\\b[^>]*stylesheet");
                  p.iframes = count(html, "<iframe\\b");
                  String body = html.replaceAll("(?is)<(script|style|noscript|template|svg)\\b.*?</\\1>", " ");
                  Matcher b = Pattern.compile("<body\\b[^>]*>(.*)</body>", F).matcher(body);
                  String txt = stripTags(b.find() ? b.group(1) : body);
                  p.text = txt;
                  p.words = txt.isEmpty() ? 0 : txt.split("\\s+").length;
                  return p;
              }

              static int count(String s, String regex) {
                  Matcher m = Pattern.compile(regex, F).matcher(s);
                  int n = 0;
                  while (m.find()) n++;
                  return n;
              }

              /** Occurrences of a phrase in text (case-insensitive, whole-word-ish). */
              public static int occurrences(String text, String phrase) {
                  if (text == null || phrase == null || phrase.trim().isEmpty()) return 0;
                  String t = " " + normKeyword(text) + " ", p = normKeyword(phrase);
                  int n = 0, i = 0;
                  while ((i = t.indexOf(p, i)) >= 0) { n++; i += p.length(); }
                  return n;
              }

              // ===================================================================== robots.txt
              public static final class RobotsGroup {
                  public final List<String> agents = new ArrayList<>();
                  public final List<String[]> rules = new ArrayList<>();   // {"allow"|"disallow", path}
              }

              public static List<RobotsGroup> parseRobots(String txt, List<String> sitemapsOut) {
                  List<RobotsGroup> groups = new ArrayList<>();
                  RobotsGroup cur = null;
                  boolean lastWasAgent = false;
                  for (String raw : txt.split("\\r?\\n")) {
                      String line = raw.replaceAll("#.*$", "").trim();
                      int c = line.indexOf(':');
                      if (c <= 0) continue;
                      String k = line.substring(0, c).trim().toLowerCase(Locale.ROOT), v = line.substring(c + 1).trim();
                      if (k.equals("user-agent")) {
                          if (cur == null || !lastWasAgent) { cur = new RobotsGroup(); groups.add(cur); }
                          cur.agents.add(v.toLowerCase(Locale.ROOT));
                          lastWasAgent = true;
                      } else {
                          lastWasAgent = false;
                          if (k.equals("sitemap")) { if (sitemapsOut != null) sitemapsOut.add(v); continue; }
                          if (cur != null && (k.equals("allow") || k.equals("disallow"))) cur.rules.add(new String[]{k, v});
                      }
                  }
                  return groups;
              }

              /** Google-style check: most specific group for the agent, longest matching rule wins, Allow wins ties. */
              public static String robotsVerdict(List<RobotsGroup> groups, String agent, String path) {
                  agent = agent.toLowerCase(Locale.ROOT);
                  RobotsGroup best = null;
                  int bestLen = -1;
                  for (RobotsGroup g : groups) for (String a : g.agents) {
                      if (a.equals("*") && bestLen < 0) { best = g; bestLen = 0; }
                      else if (!a.equals("*") && agent.contains(a) && a.length() > bestLen) { best = g; bestLen = a.length(); }
                  }
                  if (best == null) return "Разрешено (нет подходящей группы)";
                  String rule = null; int len = -1; boolean allow = true;
                  for (String[] r : best.rules) {
                      if (r[1].isEmpty()) continue;   // "Disallow:" with empty value = allow everything
                      if (robotsMatch(r[1], path) && (r[1].length() > len || (r[1].length() == len && r[0].equals("allow")))) {
                          len = r[1].length(); allow = r[0].equals("allow"); rule = r[0] + ": " + r[1];
                      }
                  }
                  if (rule == null) return "Разрешено (ни одно правило не подходит)";
                  return (allow ? "Разрешено" : "ЗАПРЕЩЕНО") + " — правило «" + rule + "»";
              }

              static boolean robotsMatch(String pattern, String path) {
                  StringBuilder re = new StringBuilder("^");
                  for (int i = 0; i < pattern.length(); i++) {
                      char ch = pattern.charAt(i);
                      if (ch == '*') re.append(".*");
                      else if (ch == '$' && i == pattern.length() - 1) re.append("$");
                      else re.append(Pattern.quote(String.valueOf(ch)));
                  }
                  return Pattern.compile(re.toString()).matcher(path).find();
              }

              // ===================================================================== sitemaps
              public static final class SitemapInfo {
                  public final List<String> urls = new ArrayList<>(), childSitemaps = new ArrayList<>();
                  public String newestLastmod, oldestLastmod;
              }

              public static SitemapInfo parseSitemap(String xml) {
                  SitemapInfo s = new SitemapInfo();
                  boolean index = xml.contains("<sitemapindex");
                  Matcher m = Pattern.compile("<loc>\\s*(?:<!\\[CDATA\\[)?(.*?)(?:\\]\\]>)?\\s*</loc>", F).matcher(xml);
                  while (m.find()) (index ? s.childSitemaps : s.urls).add(decodeEntities(m.group(1).trim()));
                  Matcher lm = Pattern.compile("<lastmod>\\s*(.*?)\\s*</lastmod>", F).matcher(xml);
                  while (lm.find()) {
                      String d = lm.group(1).trim();
                      if (s.newestLastmod == null || d.compareTo(s.newestLastmod) > 0) s.newestLastmod = d;
                      if (s.oldestLastmod == null || d.compareTo(s.oldestLastmod) < 0) s.oldestLastmod = d;
                  }
                  return s;
              }

              // ===================================================================== transliteration
              /** Official Ukrainian transliteration (KMU resolution No. 55, 2010). */
              public static String translitUk(String s) {
                  StringBuilder out = new StringBuilder();
                  String lower = s;
                  for (int i = 0; i < lower.length(); i++) {
                      char c = lower.charAt(i);
                      boolean up = Character.isUpperCase(c);
                      char lc = Character.toLowerCase(c);
                      char prevCh = i == 0 ? ' ' : lower.charAt(i - 1);
                      boolean start = i == 0 || !(Character.isLetter(prevCh) || prevCh == '\'' || prevCh == '’' || prevCh == 'ʼ');
                      String r;
                      switch (lc) {
                          case 'а': r = "a"; break; case 'б': r = "b"; break; case 'в': r = "v"; break; case 'г': r = "h"; break;
                          case 'ґ': r = "g"; break; case 'д': r = "d"; break; case 'е': r = "e"; break;
                          case 'є': r = start ? "ye" : "ie"; break; case 'ж': r = "zh"; break;
                          case 'з':
                              r = (i + 1 < lower.length() && Character.toLowerCase(lower.charAt(i + 1)) == 'г') ? "zgh" : "z";
                              if (r.equals("zgh")) i++;
                              break;
                          case 'и': r = "y"; break; case 'і': r = "i"; break; case 'ї': r = start ? "yi" : "i"; break;
                          case 'й': r = start ? "y" : "i"; break; case 'к': r = "k"; break; case 'л': r = "l"; break;
                          case 'м': r = "m"; break; case 'н': r = "n"; break; case 'о': r = "o"; break; case 'п': r = "p"; break;
                          case 'р': r = "r"; break; case 'с': r = "s"; break; case 'т': r = "t"; break; case 'у': r = "u"; break;
                          case 'ф': r = "f"; break; case 'х': r = "kh"; break; case 'ц': r = "ts"; break; case 'ч': r = "ch"; break;
                          case 'ш': r = "sh"; break; case 'щ': r = "shch"; break; case 'ь': case '\'': case '’': case 'ʼ': r = ""; break;
                          case 'ю': r = start ? "yu" : "iu"; break; case 'я': r = start ? "ya" : "ia"; break;
                          // Russian letters that may appear in mixed text
                          case 'ы': r = "y"; break; case 'э': r = "e"; break; case 'ё': r = "yo"; break; case 'ъ': r = ""; break;
                          default: r = String.valueOf(c); up = false;
                      }
                      if (up && !r.isEmpty()) r = Character.toUpperCase(r.charAt(0)) + r.substring(1);
                      out.append(r);
                  }
                  return out.toString();
              }

              /** Russian transliteration (simple, URL-friendly, close to Yandex/GOST 7.79-B). */
              public static String translitRu(String s) {
                  String[][] map = {{"щ", "shch"}, {"ш", "sh"}, {"ч", "ch"}, {"ж", "zh"}, {"ю", "yu"}, {"я", "ya"}, {"ё", "yo"}, {"х", "kh"},
                          {"ц", "ts"}, {"й", "y"}, {"ы", "y"}, {"э", "e"}, {"ъ", ""}, {"ь", ""}, {"а", "a"}, {"б", "b"}, {"в", "v"}, {"г", "g"},
                          {"д", "d"}, {"е", "e"}, {"з", "z"}, {"и", "i"}, {"к", "k"}, {"л", "l"}, {"м", "m"}, {"н", "n"}, {"о", "o"}, {"п", "p"},
                          {"р", "r"}, {"с", "s"}, {"т", "t"}, {"у", "u"}, {"ф", "f"}, {"і", "i"}, {"ї", "yi"}, {"є", "ye"}, {"ґ", "g"}};
                  StringBuilder out = new StringBuilder();
                  for (int i = 0; i < s.length(); i++) {
                      String ch = s.substring(i, i + 1), lc = ch.toLowerCase(Locale.ROOT), r = ch;
                      for (String[] m : map) if (m[0].equals(lc)) { r = m[1]; break; }
                      if (!ch.equals(lc) && !r.isEmpty()) r = Character.toUpperCase(r.charAt(0)) + r.substring(1);
                      out.append(r);
                  }
                  return out.toString();
              }

              public static String slug(String latin) {
                  return latin.toLowerCase(Locale.ROOT).replaceAll("[^a-z0-9]+", "-").replaceAll("^-+|-+$", "");
              }

              // ===================================================================== text tools
              public static List<Map.Entry<String, Integer>> wordFreq(String text, int n, int max) {
                  Map<String, Integer> cnt = new LinkedHashMap<>();
                  for (String sentence : normKeyword(text).split("[.!?;:\n]+")) {
                  String[] w = sentence.trim().split("[^\\p{L}\\p{N}'’-]+");
                  for (int i = 0; i + n <= w.length; i++) {
                      StringBuilder sb = new StringBuilder();
                      boolean skip = false;
                      for (int j = 0; j < n; j++) {
                          if (w[i + j].length() < (n == 1 ? 3 : 2) || (n == 1 && STOP.contains(w[i + j]))) { skip = true; break; }
                          if (j > 0) sb.append(' ');
                          sb.append(w[i + j]);
                      }
                      if (skip) continue;
                      String k = sb.toString();
                      Integer c = cnt.get(k);
                      cnt.put(k, c == null ? 1 : c + 1);
                  }
                  }
                  List<Map.Entry<String, Integer>> l = new ArrayList<>(cnt.entrySet());
                  Collections.sort(l, new Comparator<Map.Entry<String, Integer>>() {
                      @Override public int compare(Map.Entry<String, Integer> a, Map.Entry<String, Integer> b) { return b.getValue() - a.getValue(); }
                  });
                  return l.size() > max ? l.subList(0, max) : l;
              }

              public static String utm(String url, String source, String medium, String campaign, String term, String content) {
                  StringBuilder q = new StringBuilder();
                  String[][] p = {{"utm_source", source}, {"utm_medium", medium}, {"utm_campaign", campaign}, {"utm_term", term}, {"utm_content", content}};
                  for (String[] kv : p) {
                      if (kv[1] == null || kv[1].trim().isEmpty()) continue;
                      q.append(q.length() == 0 ? "" : "&").append(kv[0]).append('=').append(enc(kv[1].trim()));
                  }
                  if (q.length() == 0) return url;
                  String base = url.trim();
                  String frag = "";
                  int h = base.indexOf('#');
                  if (h >= 0) { frag = base.substring(h); base = base.substring(0, h); }
                  return base + (base.contains("?") ? "&" : "?") + q + frag;
              }

              static String enc(String s) {
                  try { return java.net.URLEncoder.encode(s, "UTF-8").replace("+", "%20"); } catch (Exception e) { return s; }
              }

              public static String csvCell(String s) {
                  if (s == null) return "";
                  if (s.contains(",") || s.contains("\"") || s.contains("\n") || s.contains(";")) return "\"" + s.replace("\"", "\"\"") + "\"";
                  return s;
              }
