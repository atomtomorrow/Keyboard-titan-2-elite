                  final TextView pTitle = text("", 19, 0xFF1A0DAB, false);
                  final TextView pDesc = text("", 14, 0xFF4D5156, false);
                  prev.addView(pUrl); prev.addView(pTitle); prev.addView(pDesc);
                  final Paint tp = new Paint(); tp.setTypeface(Typeface.SANS_SERIF); tp.setTextSize(20);
                  final Paint dpnt = new Paint(); dpnt.setTypeface(Typeface.SANS_SERIF); dpnt.setTextSize(14);
                  final Runnable update = new Runnable() { @Override public void run() {
                      String t = title.getText().toString(), d = desc.getText().toString();
                      float tw = tp.measureText(t), dw = dpnt.measureText(d);
                      tInfo.setText(t.length() + " симв · " + Math.round(tw) + " px из ~580" + (tw > 580 ? "  ⚠ обрежется" : t.length() < 30 ? "  ⚠ коротко" : "  ✓"));
                      tInfo.setTextColor(tw > 580 ? C_WARN : C_OK);
                      dInfo.setText(d.length() + " симв · " + Math.round(dw) + " px из ~920" + (dw > 920 ? "  ⚠ обрежется" : d.length() < 70 ? "  ⚠ коротко" : "  ✓"));
                      dInfo.setTextColor(dw > 920 ? C_WARN : C_OK);
                      String u = Net.normalizeUrl(url.getText().toString());
                      pUrl.setText(u.isEmpty() ? "site.ua › …" : u.replaceFirst("^https?://", "").replace("/", " › ").replaceAll(" › $", ""));
                      pTitle.setText(t.isEmpty() ? "Заголовок страницы" : cut(tp, t, 580));
                      pDesc.setText(d.isEmpty() ? "Описание страницы…" : cut(dpnt, d, 920));
                  } };
                  SimpleWatcher w = new SimpleWatcher() { @Override public void afterTextChanged(Editable s) { update.run(); } };
                  url.addTextChangedListener(w); title.addTextChangedListener(w); desc.addTextChangedListener(w);
                  LinearLayout br = buttonRow(c);
                  button(br, "Взять со страницы", new View.OnClickListener() { @Override public void onClick(View v) {
                      final String u = Net.normalizeUrl(url.getText().toString());
                      if (u.isEmpty()) { toast("Введите URL"); return; }
                      bg(new Runnable() { @Override public void run() {
                          List<Net.Resp> ch = Net.chain(u, 6, true);
                          final SeoCore.Page pg = SeoCore.analyze(ch.get(ch.size() - 1).body, u);
                          ui(new Runnable() { @Override public void run() {
                              title.setText(pg.title == null ? "" : pg.title);
                              desc.setText(pg.description == null ? "" : pg.description);
                          } });
                      } });
                  } });
                  button(br, "Копировать", new View.OnClickListener() { @Override public void onClick(View v) {
                      copy("<title>" + title.getText() + "</title>\n<meta name=\"description\" content=\"" + desc.getText().toString().replace("\"", "&quot;") + "\">");
                  } });
                  update.run();
              }

              static String cut(Paint p, String s, float maxPx) {
                  if (p.measureText(s) <= maxPx) return s;
                  String t = s;
                  while (t.length() > 1 && p.measureText(t + " …") > maxPx) t = t.substring(0, t.length() - 1);
                  return t.trim() + " …";
              }

