name: Build SEO Pocket
on:
  push:
    paths:
      - '.github/workflows/build-seopocket.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Write source (SeoPocket 1.0)
        run: |
          mkdir -p SeoPocket SeoPocket/app SeoPocket/app/src/main SeoPocket/app/src/main/java/com/ievhenii/seopocket SeoPocket/app/src/main/res/values
          cat > 'SeoPocket/app/build.gradle' <<'EOF_TCK'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.ievhenii.seopocket'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.ievhenii.seopocket'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF_TCK
          cat > 'SeoPocket/app/src/main/AndroidManifest.xml' <<'EOF_TCK'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="SEO Pocket"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:windowSoftInputMode="adjustResize" android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_TCK
          cat > 'SeoPocket/app/src/main/java/com/ievhenii/seopocket/MainActivity.java' <<'EOF_TCK'
          package com.ievhenii.seopocket;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Paint;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.text.Editable;
          import android.text.InputType;
          import android.text.TextWatcher;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.WindowInsets;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.HorizontalScrollView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.OutputStream;
          import java.net.InetAddress;
          import java.nio.charset.StandardCharsets;
          import java.security.cert.Certificate;
          import java.security.cert.X509Certificate;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.Date;
          import java.util.LinkedHashMap;
          import java.util.LinkedHashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.atomic.AtomicInteger;

          import javax.net.ssl.HttpsURLConnection;

          public class MainActivity extends Activity {
              // ---------------------------------------------------------------- palette
              static final int C_BG = 0xFFF4F6FB, C_CARD = 0xFFFFFFFF, C_TEXT = 0xFF141A2A, C_SUB = 0xFF5C6577, C_ACCENT = 0xFF2E5BFF,
                      C_OK = 0xFF16803C, C_WARN = 0xFFB25E00, C_BAD = 0xFFC62828, C_LINE = 0xFFE3E7EF;

              static final String[] TABS = {"Ключи UA", "Аудит", "Массово", "Robots/Sitemap", "Домен", "Сниппет", "Инструменты", "Проекты", "Настройки"};
              static final char[] TAB_KEYS = {'k', 'a', 'm', 'r', 'd', 's', 't', 'p', 'n'};

              SharedPreferences prefs;
              final ExecutorService pool = Executors.newFixedThreadPool(4);
              LinearLayout tabBar;
              FrameLayout content;
              final View[] pages = new View[TABS.length];
              final TextView[] tabViews = new TextView[TABS.length];
              int currentTab = 0;

              // ---------------------------------------------------------------- keyword collector state
              static final class KW {
                  final String text;
                  final LinkedHashSet<String> src = new LinkedHashSet<>();
                  int vol = -1, diff = -1;
                  double cost = -1, comp = -1;
                  final int order;
                  KW(String t, int o) { text = t; order = o; }
              }
              final LinkedHashMap<String, KW> kws = new LinkedHashMap<>();
              volatile boolean collecting = false, stopFlag = false;
              EditText kwSeeds, kwMinus, kwFilter;
              CheckBox cbUk, cbRu, cbGoogle, cbYoutube, cbBing, cbAlpha, cbQuest, cbComm, cbCities, cbPrefix, cbDepth;
              TextView kwStatus, kwOut, kwSortLabel;
              LinearLayout kwWords;
              Button kwStart;
              int kwSort = 0;   // 0 order, 1 volume, 2 a-z, 3 length
              String wordFilter = null;

              // audit
              EditText auditUrl, auditKey;
              TextView auditOut;

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  prefs = getSharedPreferences("seo", MODE_PRIVATE);
                  applySettings();
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(C_BG);
                  root.setOnApplyWindowInsetsListener(new View.OnApplyWindowInsetsListener() {
                      @Override public WindowInsets onApplyWindowInsets(View v, WindowInsets in) {
                          int top, bottom;
                          if (Build.VERSION.SDK_INT >= 30) {
                              android.graphics.Insets s = in.getInsets(WindowInsets.Type.systemBars() | WindowInsets.Type.ime());
                              top = s.top; bottom = s.bottom;
                          } else { top = in.getSystemWindowInsetTop(); bottom = in.getSystemWindowInsetBottom(); }
                          v.setPadding(0, top, 0, bottom);
                          return in;
                      }
                  });

                  LinearLayout header = new LinearLayout(this);
                  header.setOrientation(LinearLayout.HORIZONTAL);
                  header.setGravity(Gravity.CENTER_VERTICAL);
                  header.setPadding(dp(14), dp(10), dp(14), dp(4));
                  TextView logo = new TextView(this);
                  logo.setText("SEO");
                  logo.setTextColor(0xFFFFFFFF);
                  logo.setTypeface(Typeface.DEFAULT_BOLD);
                  logo.setTextSize(13);
                  logo.setGravity(Gravity.CENTER);
                  logo.setBackground(round(C_ACCENT, 8));
                  header.addView(logo, new LinearLayout.LayoutParams(dp(40), dp(28)));
                  TextView title = new TextView(this);
                  title.setText("  Pocket");
                  title.setTextSize(20);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  title.setTextColor(C_TEXT);
                  header.addView(title);
                  TextView hint = new TextView(this);
                  hint.setText("   K A M R D S T P N — вкладки");
                  hint.setTextSize(11);
                  hint.setTextColor(C_SUB);
                  header.addView(hint);
                  root.addView(header);

                  HorizontalScrollView hs = new HorizontalScrollView(this);
                  hs.setHorizontalScrollBarEnabled(false);
                  tabBar = new LinearLayout(this);
                  tabBar.setPadding(dp(10), dp(4), dp(10), dp(6));
                  hs.addView(tabBar);
                  root.addView(hs);
                  for (int i = 0; i < TABS.length; i++) {
                      final int idx = i;
                      TextView t = new TextView(this);
                      t.setText(TABS[i]);
                      t.setTextSize(14);
                      t.setPadding(dp(14), dp(7), dp(14), dp(7));
                      t.setOnClickListener(new View.OnClickListener() { @Override public void onClick(View v) { showTab(idx); } });
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-2, -2);
                      lp.rightMargin = dp(6);
                      tabBar.addView(t, lp);
                      tabViews[i] = t;
                  }
                  content = new FrameLayout(this);
                  root.addView(content, new LinearLayout.LayoutParams(-1, 0, 1));
                  setContentView(root);
                  showTab(prefs.getInt("tab", 0));
                  handleShare(getIntent());
              }

              @Override protected void onNewIntent(Intent i) { super.onNewIntent(i); handleShare(i); }

              /** "Share" a link from the browser to SEO Pocket -> audit it right away. */
              void handleShare(Intent i) {
                  if (i == null || !Intent.ACTION_SEND.equals(i.getAction())) return;
                  String t = i.getStringExtra(Intent.EXTRA_TEXT);
                  if (t == null) return;
                  java.util.regex.Matcher m = java.util.regex.Pattern.compile("https?://\\S+").matcher(t);
                  if (!m.find()) return;
                  showTab(1);
                  auditUrl.setText(m.group());
                  runAudit();
              }

              @Override public boolean dispatchKeyEvent(KeyEvent e) {
                  View f = getCurrentFocus();
                  if (e.getAction() == KeyEvent.ACTION_DOWN && !(f instanceof EditText) && !e.isAltPressed() && !e.isCtrlPressed()) {
                      int code = e.getKeyCode();
                      if (code >= KeyEvent.KEYCODE_A && code <= KeyEvent.KEYCODE_Z) {
                          char c = (char) ('a' + code - KeyEvent.KEYCODE_A);
                          for (int i = 0; i < TAB_KEYS.length; i++) if (TAB_KEYS[i] == c) { showTab(i); return true; }
                      }
                  }
                  return super.dispatchKeyEvent(e);
              }

              void showTab(int i) {
                  if (i < 0 || i >= TABS.length) i = 0;
                  currentTab = i;
                  prefs.edit().putInt("tab", i).apply();
                  for (int k = 0; k < TABS.length; k++) {
                      boolean on = k == i;
                      tabViews[k].setTextColor(on ? 0xFFFFFFFF : C_TEXT);
                      tabViews[k].setTypeface(on ? Typeface.DEFAULT_BOLD : Typeface.DEFAULT);
                      tabViews[k].setBackground(round(on ? C_ACCENT : 0xFFE6EAF3, 16));
                  }
                  if (pages[i] == null) pages[i] = buildPage(i);
                  content.removeAllViews();
                  content.addView(pages[i], new FrameLayout.LayoutParams(-1, -1));
              }

              View buildPage(int i) {
                  ScrollView sv = new ScrollView(this);
                  sv.setFillViewport(true);
                  LinearLayout p = new LinearLayout(this);
                  p.setOrientation(LinearLayout.VERTICAL);
                  p.setPadding(dp(12), dp(4), dp(12), dp(24));
                  sv.addView(p);
                  switch (i) {
                      case 0: pageKeywords(p); break;
                      case 1: pageAudit(p); break;
                      case 2: pageBulk(p); break;
                      case 3: pageRobots(p); break;
                      case 4: pageDomain(p); break;
                      case 5: pageSnippet(p); break;
                      case 6: pageTools(p); break;
                      case 7: pageProjects(p); break;
                      default: pageSettings(p); break;
                  }
                  return sv;
              }

              // ================================================================ UI helpers
              int dp(float v) { return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, getResources().getDisplayMetrics()); }

              GradientDrawable round(int color, int r) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(r));
                  return g;
              }

              LinearLayout card(LinearLayout parent, String title, String sub) {
                  LinearLayout c = new LinearLayout(this);
                  c.setOrientation(LinearLayout.VERTICAL);
                  c.setBackground(round(C_CARD, 14));
                  c.setPadding(dp(12), dp(10), dp(12), dp(12));
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, -2);
                  lp.topMargin = dp(8);
                  parent.addView(c, lp);
                  if (title != null) {
                      TextView t = text(title, 16, C_TEXT, true);
                      c.addView(t);
                  }
                  if (sub != null) {
                      TextView s = text(sub, 12, C_SUB, false);
                      s.setPadding(0, dp(2), 0, dp(6));
                      c.addView(s);
                  }
                  return c;
              }

              TextView text(String s, int sp, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setTextColor(color);
                  if (bold) t.setTypeface(Typeface.DEFAULT_BOLD);
                  return t;
              }

              EditText input(LinearLayout parent, String hint, boolean multi, String prefKey) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setTextSize(15);
                  e.setTextColor(C_TEXT);
                  int type = InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_FLAG_NO_SUGGESTIONS;
                  if (multi) { type |= InputType.TYPE_TEXT_FLAG_MULTI_LINE; e.setMinLines(3); e.setGravity(Gravity.TOP | Gravity.START); }
                  else e.setSingleLine(true);
                  e.setInputType(type);
                  if (prefKey != null) {
                      e.setText(prefs.getString(prefKey, ""));
                      final String k = prefKey;
                      e.addTextChangedListener(new SimpleWatcher() { @Override public void afterTextChanged(Editable s) { prefs.edit().putString(k, s.toString()).apply(); } });
                  }
                  parent.addView(e, new LinearLayout.LayoutParams(-1, -2));
                  return e;
              }

              Button button(LinearLayout parent, String label, View.OnClickListener l) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setAllCaps(false);
                  b.setTextSize(14);
                  b.setOnClickListener(l);
                  parent.addView(b, new LinearLayout.LayoutParams(-2, -2));
                  return b;
              }

              LinearLayout row(LinearLayout parent) {
                  LinearLayout r = new LinearLayout(this);
                  r.setOrientation(LinearLayout.HORIZONTAL);
                  r.setGravity(Gravity.CENTER_VERTICAL);
                  parent.addView(r, new LinearLayout.LayoutParams(-1, -2));
                  return r;
              }

              /** A horizontally scrolling row of buttons (fits the small square screen). */
              LinearLayout buttonRow(LinearLayout parent) {
                  HorizontalScrollView hs = new HorizontalScrollView(this);
                  hs.setHorizontalScrollBarEnabled(false);
                  LinearLayout r = new LinearLayout(this);
                  hs.addView(r);
                  parent.addView(hs, new LinearLayout.LayoutParams(-1, -2));
                  return r;
              }

              CheckBox check(LinearLayout parent, String label, String key, boolean def) {
                  CheckBox c = new CheckBox(this);
                  c.setText(label);
                  c.setTextSize(14);
                  c.setTextColor(C_TEXT);
                  c.setChecked(prefs.getBoolean(key, def));
                  final String k = key;
                  c.setOnCheckedChangeListener(new android.widget.CompoundButton.OnCheckedChangeListener() {
                      @Override public void onCheckedChanged(android.widget.CompoundButton b, boolean on) { prefs.edit().putBoolean(k, on).apply(); }
                  });
                  parent.addView(c, new LinearLayout.LayoutParams(-2, -2));
                  return c;
              }

              TextView output(LinearLayout parent) {
                  TextView t = new TextView(this);
                  t.setTextSize(13);
                  t.setTextColor(C_TEXT);
                  t.setTypeface(Typeface.MONOSPACE);
                  t.setTextIsSelectable(true);
                  t.setPadding(dp(8), dp(8), dp(8), dp(8));
                  t.setBackground(round(0xFFF7F8FC, 10));
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, -2);
                  lp.topMargin = dp(6);
                  parent.addView(t, lp);
                  return t;
              }

              abstract static class SimpleWatcher implements TextWatcher {
                  @Override public void beforeTextChanged(CharSequence s, int a, int b, int c) { }
                  @Override public void onTextChanged(CharSequence s, int a, int b, int c) { }
              }

              void bg(Runnable r) { pool.execute(r); }
              void ui(Runnable r) { runOnUiThread(r); }
              void toast(String s) { Toast.makeText(this, s, Toast.LENGTH_SHORT).show(); }

              void copy(String s) {
                  ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                  cm.setPrimaryClip(ClipData.newPlainText("SEO Pocket", s));
                  toast("Скопировано");
              }

              void share(String s, String subject) {
                  Intent i = new Intent(Intent.ACTION_SEND);
                  i.setType("text/plain");
                  i.putExtra(Intent.EXTRA_SUBJECT, subject);
                  i.putExtra(Intent.EXTRA_TEXT, s);
                  startActivity(Intent.createChooser(i, "Отправить"));
              }

              void open(String url) {
                  try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url))); } catch (Exception e) { toast("Нет браузера"); }
              }

              String pendingSave;
              static final int REQ_SAVE = 4101;

              void saveFile(String name, String mime, String data) {
                  pendingSave = data;
                  Intent i = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType(mime);
                  i.putExtra(Intent.EXTRA_TITLE, name);
                  startActivityForResult(i, REQ_SAVE);
              }

              @Override protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req != REQ_SAVE || res != RESULT_OK || data == null || data.getData() == null || pendingSave == null) return;
                  try (OutputStream os = getContentResolver().openOutputStream(data.getData())) {
                      if (os == null) throw new Exception("нет доступа");
                      os.write(new byte[]{(byte) 0xEF, (byte) 0xBB, (byte) 0xBF});   // BOM: Excel opens Cyrillic correctly
                      os.write(pendingSave.getBytes(StandardCharsets.UTF_8));
                      toast("Файл сохранён");
                  } catch (Exception e) { toast("Ошибка: " + e.getMessage()); }
                  pendingSave = null;
              }

              void applySettings() {
                  int ua = prefs.getInt("ua", 0);
                  Net.userAgent = ua == 1 ? Net.UA_DESKTOP : ua == 2 ? Net.UA_GOOGLEBOT : Net.UA_MOBILE;
                  Net.timeoutMs = prefs.getInt("timeout", 15) * 1000;
              }

              static String kb(long bytes) { return bytes < 1024 ? bytes + " Б" : String.format(Locale.ROOT, "%.1f КБ", bytes / 1024.0); }

              // ================================================================ 1. KEYWORDS (Ukraine)
              void pageKeywords(LinearLayout p) {
                  LinearLayout c = card(p, "Сбор ключей по Украине", "Подсказки Google, YouTube и Bing для региона UA. Каждая фраза расширяется модификаторами — получаются сотни реальных запросов.");
                  kwSeeds = input(c, "Ключевые фразы, по одной в строке", true, "kwSeeds");
                  TextView l1 = text("Язык подсказок", 13, C_SUB, true); l1.setPadding(0, dp(6), 0, 0); c.addView(l1);
                  LinearLayout r1 = row(c);
                  cbUk = check(r1, "Українська", "kwUk", true);
                  cbRu = check(r1, "Русский", "kwRu", true);
                  TextView l2 = text("Источники", 13, C_SUB, true); c.addView(l2);
                  LinearLayout r2 = row(c);
                  cbGoogle = check(r2, "Google", "kwG", true);
                  cbYoutube = check(r2, "YouTube", "kwY", false);
                  cbBing = check(r2, "Bing", "kwB", false);
                  TextView l3 = text("Расширение", 13, C_SUB, true); c.addView(l3);
                  cbAlpha = check(c, "Алфавит: фраза + а…я, a…z, 0…9", "kwAlpha", true);
                  cbPrefix = check(c, "…и буква перед фразой", "kwPrefix", false);
                  cbQuest = check(c, "Вопросы: як / що / де / скільки / как / сколько…", "kwQuest", true);
                  cbComm = check(c, "Коммерция: купити, ціна, відгуки, доставка…", "kwComm", true);
                  cbCities = check(c, "Города Украины: Київ, Львів, Одеса, Дніпро…", "kwCities", false);
                  cbDepth = check(c, "Глубина 2: расширить 50 найденных фраз", "kwDepth", false);
                  kwMinus = input(c, "Минус-слова через пробел или запятую (бесплатно, скачать, бу…)", false, "kwMinus");
                  LinearLayout br = buttonRow(c);
                  kwStart = button(br, "▶ Собрать", new View.OnClickListener() { @Override public void onClick(View v) { toggleCollect(); } });
                  button(br, "Оценить объём", new View.OnClickListener() { @Override public void onClick(View v) { toast("Будет запросов: ≈" + estimateRequests()); } });
                  kwStatus = text("Готово к сбору", 13, C_SUB, false);
                  c.addView(kwStatus);

                  LinearLayout res = card(p, "Результаты", null);
                  kwFilter = input(res, "Фильтр по слову…", false, null);
                  kwFilter.addTextChangedListener(new SimpleWatcher() { @Override public void afterTextChanged(Editable s) { renderKeywords(); } });
                  LinearLayout sr = buttonRow(res);
                  kwSortLabel = text("", 12, C_SUB, false);
                  button(sr, "Сортировка", new View.OnClickListener() { @Override public void onClick(View v) { kwSort = (kwSort + 1) % 4; renderKeywords(); } });
                  button(sr, "Частотность Serpstat", new View.OnClickListener() { @Override public void onClick(View v) { serpstatVolumes(); } });
                  button(sr, "Копировать", new View.OnClickListener() { @Override public void onClick(View v) { copy(keywordsPlain()); } });
                  button(sr, "CSV → файл", new View.OnClickListener() { @Override public void onClick(View v) { saveFile("keywords-ua.csv", "text/csv", keywordsCsv()); } });
                  button(sr, "Поделиться", new View.OnClickListener() { @Override public void onClick(View v) { share(keywordsCsv(), "Ключи"); } });
                  button(sr, "Сохранить сбор", new View.OnClickListener() { @Override public void onClick(View v) { saveCollection(); } });
                  button(sr, "Очистить", new View.OnClickListener() { @Override public void onClick(View v) { kws.clear(); wordFilter = null; renderKeywords(); } });
                  res.addView(kwSortLabel);
                  TextView wl = text("Частые слова (нажми — отфильтровать, ещё раз — снять):", 12, C_SUB, false);
                  wl.setPadding(0, dp(6), 0, dp(2));
                  res.addView(wl);
                  HorizontalScrollView whs = new HorizontalScrollView(this);
                  kwWords = new LinearLayout(this);
                  whs.addView(kwWords);
                  res.addView(whs);
                  kwOut = output(res);
                  renderKeywords();
              }

              List<String> seeds() {
                  List<String> s = new ArrayList<>();
                  for (String line : kwSeeds.getText().toString().split("\\n")) if (!line.trim().isEmpty()) s.add(line.trim());
                  return s;
              }

              List<String> minusWords() {
                  List<String> m = new ArrayList<>();
                  for (String w : kwMinus.getText().toString().split("[,;\\n]+|\\s+")) if (!w.trim().isEmpty()) m.add(w.trim());
                  return m;
              }

              List<String> langs() {
                  List<String> l = new ArrayList<>();
                  if (cbUk.isChecked()) l.add("uk");
                  if (cbRu.isChecked()) l.add("ru");
                  if (l.isEmpty()) l.add("uk");
                  return l;
              }

              List<String> sources() {
                  List<String> s = new ArrayList<>();
                  if (cbGoogle.isChecked()) s.add("google");
                  if (cbYoutube.isChecked()) s.add("youtube");
                  if (cbBing.isChecked()) s.add("bing");
                  if (s.isEmpty()) s.add("google");
                  return s;
              }

              int estimateRequests() {
                  int n = 0;
                  for (String s : seeds()) n += SeoCore.buildQueries(s, cbUk.isChecked(), cbRu.isChecked(), cbAlpha.isChecked(), cbQuest.isChecked(),
                          cbComm.isChecked(), cbCities.isChecked(), cbPrefix.isChecked()).size();
                  int perQuery = 0;
                  for (String src : sources()) perQuery += src.equals("bing") ? 1 : langs().size();
                  n *= perQuery;
                  if (cbDepth.isChecked()) n += 50 * perQuery;
                  return n;
              }

              void toggleCollect() {
                  if (collecting) { stopFlag = true; kwStart.setText("▶ Собрать"); return; }
                  final List<String> seeds = seeds();
                  if (seeds.isEmpty()) { toast("Введите хотя бы одну фразу"); return; }
                  final List<String> minus = minusWords(), langs = langs(), sources = sources();
                  final boolean uk = cbUk.isChecked(), ru = cbRu.isChecked(), alpha = cbAlpha.isChecked(), quest = cbQuest.isChecked(),
                          comm = cbComm.isChecked(), cities = cbCities.isChecked(), prefix = cbPrefix.isChecked(), depth = cbDepth.isChecked();
                  final int delay = prefs.getInt("delay", 150);
                  final int total = estimateRequests();
                  collecting = true;
                  stopFlag = false;
                  kwStart.setText("■ Стоп");
                  new Thread(new Runnable() {
                      @Override public void run() {
                          AtomicInteger done = new AtomicInteger();
                          List<String> fresh = new ArrayList<>();
                          try {
                              for (String seed : seeds) {
                                  for (String q : SeoCore.buildQueries(seed, uk, ru, alpha, quest, comm, cities, prefix)) {
                                      for (String src : sources) for (String lang : src.equals("bing") ? Collections.singletonList("uk") : langs) {
                                          if (stopFlag) return;
                                          List<String> got = Net.suggest(src, q, lang);
                                          addKeywords(got, src, minus, fresh);
                                          progress(done.incrementAndGet(), total);
                                          sleep(delay);
                                      }
                                  }
                              }
                              if (depth) {
                                  List<String> more = new ArrayList<>(fresh.subList(0, Math.min(50, fresh.size())));
                                  for (String q : more) for (String src : sources) for (String lang : src.equals("bing") ? Collections.singletonList("uk") : langs) {
                                      if (stopFlag) return;
                                      addKeywords(Net.suggest(src, q + " ", lang), src, minus, null);
                                      progress(done.incrementAndGet(), total);
                                      sleep(delay);
                                  }
                              }
                          } finally {
                              collecting = false;
                              ui(new Runnable() { @Override public void run() {
                                  kwStart.setText("▶ Собрать");
                                  kwStatus.setText((stopFlag ? "Остановлено. " : "Готово. ") + "Найдено фраз: " + kws.size());
                                  renderKeywords();
                              } });
                          }
                      }
                  }).start();
              }

              static void sleep(int ms) { try { Thread.sleep(ms); } catch (InterruptedException ignored) { } }

              void addKeywords(List<String> got, String src, List<String> minus, List<String> fresh) {
                  synchronized (kws) {
                      for (String g : got) {
                          String k = SeoCore.normKeyword(g);
                          if (k.isEmpty() || SeoCore.hasMinus(k, minus)) continue;
                          KW kw = kws.get(k);
                          if (kw == null) { kw = new KW(k, kws.size()); kws.put(k, kw); if (fresh != null) fresh.add(k); }
                          kw.src.add(src.equals("google") ? "G" : src.equals("youtube") ? "Y" : "B");
                      }
                  }
              }

              long lastRender = 0;
              void progress(final int done, final int total) {
                  long now = System.currentTimeMillis();
                  if (now - lastRender < 700 && done < total) return;
                  lastRender = now;
                  ui(new Runnable() { @Override public void run() {
                      kwStatus.setText("Запросов " + done + " / ~" + total + " · найдено " + kws.size());
                      renderKeywords();
                  } });
              }

              List<KW> visibleKeywords() {
                  List<KW> list;
                  synchronized (kws) { list = new ArrayList<>(kws.values()); }
                  String f = kwFilter == null ? "" : SeoCore.normKeyword(kwFilter.getText().toString());
                  List<KW> out = new ArrayList<>();
                  for (KW k : list) {
                      if (!f.isEmpty() && !k.text.contains(f)) continue;
                      if (wordFilter != null && !(" " + k.text + " ").contains(" " + wordFilter)) continue;
                      out.add(k);
                  }
                  Comparator<KW> cmp;
                  switch (kwSort) {
                      case 1: cmp = new Comparator<KW>() { @Override public int compare(KW a, KW b) { return b.vol - a.vol; } }; break;
                      case 2: cmp = new Comparator<KW>() { @Override public int compare(KW a, KW b) { return a.text.compareTo(b.text); } }; break;
                      case 3: cmp = new Comparator<KW>() { @Override public int compare(KW a, KW b) { return a.text.length() - b.text.length(); } }; break;
                      default: cmp = new Comparator<KW>() { @Override public int compare(KW a, KW b) { return a.order - b.order; } };
                  }
                  Collections.sort(out, cmp);
                  return out;
              }

              void renderKeywords() {
                  if (kwOut == null) return;
                  List<KW> list = visibleKeywords();
                  String[] sorts = {"порядок сбора", "частотность", "А–Я", "длина"};
                  kwSortLabel.setText("Показано " + list.size() + " из " + kws.size() + " · сортировка: " + sorts[kwSort]
                          + (wordFilter != null ? " · слово: «" + wordFilter + "»" : ""));
                  StringBuilder sb = new StringBuilder();
                  int shown = 0;
                  for (KW k : list) {
                      if (shown++ >= 3000) { sb.append("… ещё ").append(list.size() - 3000).append(" (полный список — в CSV)\n"); break; }
                      sb.append(k.text);
                      if (k.vol >= 0) sb.append("  ·  ").append(k.vol);
                      if (k.cost >= 0) sb.append("  ·  $").append(String.format(Locale.ROOT, "%.2f", k.cost));
                      if (k.diff >= 0) sb.append("  ·  KD ").append(k.diff);
                      sb.append("  [").append(join(k.src, "")).append("]\n");
                  }
                  kwOut.setText(list.isEmpty() ? "Пока пусто" : sb.toString());
                  // frequent words
                  kwWords.removeAllViews();
                  List<String> texts = new ArrayList<>();
                  for (KW k : list) texts.add(k.text);
                  for (Map.Entry<String, Integer> e : SeoCore.topWords(texts, 25, seeds())) {
                      final String w = e.getKey();
                      TextView chip = text(w + " " + e.getValue(), 13, w.equals(wordFilter) ? 0xFFFFFFFF : C_ACCENT, false);
                      chip.setPadding(dp(10), dp(5), dp(10), dp(5));
                      chip.setBackground(round(w.equals(wordFilter) ? C_ACCENT : 0xFFE8EDFF, 14));
                      chip.setOnClickListener(new View.OnClickListener() { @Override public void onClick(View v) {
                          wordFilter = w.equals(wordFilter) ? null : w;
                          renderKeywords();
                      } });
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-2, -2);
                      lp.rightMargin = dp(5);
                      kwWords.addView(chip, lp);
                  }
              }

              static String join(Iterable<String> items, String sep) {
                  StringBuilder sb = new StringBuilder();
                  for (String s : items) { if (sb.length() > 0) sb.append(sep); sb.append(s); }
                  return sb.toString();
              }

              String keywordsPlain() {
                  StringBuilder sb = new StringBuilder();
                  for (KW k : visibleKeywords()) sb.append(k.text).append('\n');
                  return sb.toString();
              }

              String keywordsCsv() {
                  StringBuilder sb = new StringBuilder("Ключ;Частотность (UA);CPC $;Сложность;Конкуренция;Источники\n");
                  for (KW k : visibleKeywords()) {
                      sb.append(SeoCore.csvCell(k.text)).append(';')
                              .append(k.vol >= 0 ? k.vol : "").append(';')
                              .append(k.cost >= 0 ? String.format(Locale.ROOT, "%.2f", k.cost) : "").append(';')
                              .append(k.diff >= 0 ? k.diff : "").append(';')
                              .append(k.comp >= 0 ? String.format(Locale.ROOT, "%.2f", k.comp) : "").append(';')
                              .append(join(k.src, "")).append('\n');
                  }
                  return sb.toString();
              }

              /** Serpstat API v4, database g_ua (Google Ukraine). Needs the user's own token (Settings). */
              void serpstatVolumes() {
                  final String token = prefs.getString("serpToken", "").trim();
                  if (token.isEmpty()) { toast("Укажите токен Serpstat во вкладке «Настройки»"); showTab(8); return; }
                  final List<KW> list = visibleKeywords();
                  if (list.isEmpty()) { toast("Нет ключей"); return; }
                  final String se = prefs.getString("serpSe", "g_ua").trim().isEmpty() ? "g_ua" : prefs.getString("serpSe", "g_ua").trim();
                  kwStatus.setText("Serpstat: запрашиваю частотность для " + list.size() + " фраз…");
                  bg(new Runnable() { @Override public void run() {
                      int ok = 0;
                      String err = null;
                      for (int i = 0; i < list.size(); i += 50) {
                          List<KW> part = list.subList(i, Math.min(list.size(), i + 50));
                          try {
                              JSONArray arr = new JSONArray();
                              for (KW k : part) arr.put(k.text);
                              JSONObject params = new JSONObject();
                              params.put("keywords", arr);
                              params.put("se", se);
                              JSONObject req = new JSONObject();
                              req.put("id", "1");
                              req.put("method", "SerpstatKeywordProcedure.getKeywordsInfo");
                              req.put("params", params);
                              Net.Resp r = Net.fetch("https://api.serpstat.com/v4/?token=" + Net.enc(token), true, 4 * 1024 * 1024, req.toString());
                              if (r.body == null) { err = r.error != null ? r.error : "HTTP " + r.code; break; }
                              JSONObject js = new JSONObject(r.body);
                              if (js.has("error")) { err = js.getJSONObject("error").optString("message", "ошибка API"); break; }
                              JSONObject result = js.optJSONObject("result");
                              JSONArray data = result == null ? null : result.optJSONArray("data");
                              if (data == null) continue;
                              for (int j = 0; j < data.length(); j++) {
                                  JSONObject d = data.getJSONObject(j);
                                  String key = SeoCore.normKeyword(d.optString("keyword", ""));
                                  KW kw;
                                  synchronized (kws) { kw = kws.get(key); }
                                  if (kw == null) continue;
                                  kw.vol = d.optInt("region_queries_count", d.optInt("volume", -1));
                                  kw.cost = d.optDouble("cost", -1);
                                  kw.diff = d.isNull("difficulty") ? -1 : d.optInt("difficulty", -1);
                                  kw.comp = d.optDouble("concurrency", -1);
                                  ok++;
                              }
                          } catch (Exception e) { err = e.getMessage(); break; }
                      }
                      final int got = ok; final String error = err;
                      ui(new Runnable() { @Override public void run() {
                          kwSort = 1;
                          kwStatus.setText("Serpstat: частотность получена для " + got + " фраз" + (error != null ? " · ошибка: " + error : ""));
                          renderKeywords();
                      } });
                  } });
              }

              void saveCollection() {
                  if (kws.isEmpty()) { toast("Нечего сохранять"); return; }
                  try {
                      JSONArray all = new JSONArray(prefs.getString("collections", "[]"));
                      JSONObject o = new JSONObject();
                      List<String> s = seeds();
                      o.put("name", s.isEmpty() ? "Сбор" : s.get(0) + (s.size() > 1 ? " +" + (s.size() - 1) : ""));
                      o.put("date", new SimpleDateFormat("dd.MM.yyyy HH:mm", Locale.ROOT).format(new Date()));
                      o.put("csv", keywordsCsv());
                      o.put("count", visibleKeywords().size());
                      JSONArray next = new JSONArray();
                      next.put(o);
                      for (int i = 0; i < all.length() && i < 19; i++) next.put(all.get(i));
                      prefs.edit().putString("collections", next.toString()).apply();
                      toast("Сбор сохранён — вкладка «Проекты»");
                      if (pages[7] != null) { pages[7] = null; }
                  } catch (Exception e) { toast("Ошибка: " + e.getMessage()); }
              }

              void loadCollection(String csv) {
                  synchronized (kws) {
                      kws.clear();
                      String[] lines = csv.split("\\n");
                      for (int i = 1; i < lines.length; i++) {
                          String[] c = lines[i].split(";", -1);
                          if (c.length < 1 || c[0].isEmpty()) continue;
                          String key = c[0].replaceAll("^\"|\"$", "");
                          KW k = new KW(key, kws.size());
                          try { if (c.length > 1 && !c[1].isEmpty()) k.vol = Integer.parseInt(c[1]); } catch (Exception ignored) { }
                          try { if (c.length > 2 && !c[2].isEmpty()) k.cost = Double.parseDouble(c[2]); } catch (Exception ignored) { }
                          try { if (c.length > 3 && !c[3].isEmpty()) k.diff = Integer.parseInt(c[3]); } catch (Exception ignored) { }
                          if (c.length > 5) for (char ch : c[5].toCharArray()) k.src.add(String.valueOf(ch));
                          kws.put(key, k);
                      }
                  }
                  showTab(0);
                  renderKeywords();
              }

