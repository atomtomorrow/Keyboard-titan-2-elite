              public static volatile String userAgent = UA_MOBILE;
              public static volatile int timeoutMs = 15000;

              public static final class Resp {
                  public int code = -1;
                  public String url, location, contentType, contentEncoding, error, body;
                  public Map<String, List<String>> headers;
                  public long ms, bytesOnWire, bytesDecoded;
                  public String header(String name) {
                      if (headers == null) return null;
                      for (Map.Entry<String, List<String>> e : headers.entrySet()) {
                          if (e.getKey() != null && e.getKey().equalsIgnoreCase(name) && !e.getValue().isEmpty()) return e.getValue().get(0);
                      }
                      return null;
                  }
              }

              public static String normalizeUrl(String u) {
                  u = u.trim();
                  if (u.isEmpty()) return u;
                  if (!u.matches("(?i)^[a-z]+://.*")) u = "https://" + u;
                  return u;
              }

              public static String enc(String s) {
                  try { return URLEncoder.encode(s, "UTF-8"); } catch (Exception e) { return s; }
              }

              /** One request, no redirect following. readBody=false for HEAD-like checks (body is still drained up to maxBytes). */
              public static Resp fetch(String url, boolean readBody, int maxBytes, String postJson) {
                  Resp r = new Resp();
                  r.url = url;
                  HttpURLConnection c = null;
                  long t0 = System.nanoTime();
                  try {
                      c = (HttpURLConnection) new URL(url).openConnection();
                      c.setInstanceFollowRedirects(false);
                      c.setConnectTimeout(timeoutMs);
                      c.setReadTimeout(timeoutMs);
                      c.setRequestProperty("User-Agent", userAgent);
                      c.setRequestProperty("Accept", "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8");
                      c.setRequestProperty("Accept-Language", "uk-UA,uk;q=0.9,ru;q=0.8,en;q=0.7");
                      c.setRequestProperty("Accept-Encoding", "gzip");
                      if (postJson != null) {
                          c.setRequestMethod("POST");
                          c.setDoOutput(true);
                          c.setRequestProperty("Content-Type", "application/json");
                          byte[] b = postJson.getBytes(StandardCharsets.UTF_8);
                          try (OutputStream os = c.getOutputStream()) { os.write(b); }
                      }
                      r.code = c.getResponseCode();
                      r.headers = c.getHeaderFields();
                      r.location = c.getHeaderField("Location");
                      r.contentType = c.getContentType();
                      r.contentEncoding = c.getContentEncoding();
                      InputStream in = r.code >= 400 ? c.getErrorStream() : c.getInputStream();
                      if (in != null) {
                          CountingStream cs = new CountingStream(in);
                          InputStream body = "gzip".equalsIgnoreCase(r.contentEncoding) ? new GZIPInputStream(cs) : cs;
                          ByteArrayOutputStream bo = new ByteArrayOutputStream();
                          byte[] buf = new byte[16384];
                          int n;
                          while ((n = body.read(buf)) > 0) {
                              if (bo.size() < maxBytes) bo.write(buf, 0, Math.min(n, maxBytes - bo.size()));
                              else if (!readBody) break;
                          }
                          body.close();
                          r.bytesOnWire = cs.count;
                          byte[] bytes = bo.toByteArray();
                          r.bytesDecoded = bytes.length;
                          if (readBody) r.body = new String(bytes, charsetOf(r.contentType, bytes));
                      }
                  } catch (Exception e) {
                      r.error = e.getClass().getSimpleName() + (e.getMessage() != null ? ": " + e.getMessage() : "");
                  } finally {
                      r.ms = (System.nanoTime() - t0) / 1000000;
                      if (c != null) c.disconnect();
                  }
                  return r;
              }

              /** Follows redirects by hand so every hop (code, URL) is visible. The last element is the final response. */
              public static List<Resp> chain(String url, int maxHops, boolean readFinalBody) {
                  List<Resp> out = new ArrayList<>();
                  String cur = normalizeUrl(url);
                  for (int i = 0; i <= maxHops; i++) {
                      Resp r = fetch(cur, readFinalBody, 3 * 1024 * 1024, null);
                      out.add(r);
                      if (r.code >= 300 && r.code < 400 && r.location != null) {
                          cur = resolve(cur, r.location);
                      } else break;
                  }
                  return out;
              }

              public static String resolve(String base, String loc) {
                  try { return new URL(new URL(base), loc).toString(); } catch (Exception e) { return loc; }
              }

              static Charset charsetOf(String contentType, byte[] bytes) {
                  String cs = null;
                  if (contentType != null) {
                      Matcher m = Pattern.compile("charset=([\\w-]+)", Pattern.CASE_INSENSITIVE).matcher(contentType);
                      if (m.find()) cs = m.group(1);
                  }
                  if (cs == null) {
                      String head = new String(bytes, 0, Math.min(bytes.length, 4096), StandardCharsets.ISO_8859_1);
                      Matcher m = Pattern.compile("charset\\s*=\\s*[\"']?([\\w-]+)", Pattern.CASE_INSENSITIVE).matcher(head);
                      if (m.find()) cs = m.group(1);
                  }
                  try { if (cs != null) return Charset.forName(cs.toUpperCase(Locale.ROOT)); } catch (Exception ignored) { }
                  return StandardCharsets.UTF_8;
              }

              static final class CountingStream extends java.io.FilterInputStream {
                  long count;
                  CountingStream(InputStream in) { super(in); }
                  @Override public int read() throws java.io.IOException { int b = super.read(); if (b >= 0) count++; return b; }
                  @Override public int read(byte[] b, int off, int len) throws java.io.IOException {
                      int n = super.read(b, off, len); if (n > 0) count += n; return n;
                  }
              }

              // ------------------------------------------------------------------ keyword suggestion sources
              /** source: "google" | "youtube" | "bing";  lang: "uk" | "ru". Region is always Ukraine. */
              public static List<String> suggest(String source, String query, String lang) {
                  String url;
                  switch (source) {
                      case "youtube":
                          url = "https://suggestqueries.google.com/complete/search?client=firefox&ds=yt&hl=" + lang + "&gl=ua&ie=utf-8&oe=utf-8&q=" + enc(query);
                          break;
                      case "bing":
                          url = "https://api.bing.com/osjson.aspx?market=uk-UA&query=" + enc(query);
                          break;
                      default:
                          url = "https://suggestqueries.google.com/complete/search?client=firefox&hl=" + lang + "&gl=ua&ie=utf-8&oe=utf-8&q=" + enc(query);
                  }
                  Resp r = fetch(url, true, 512 * 1024, null);
                  if (r.code != 200 || r.body == null) return new ArrayList<>();
                  return SeoCore.parseSuggestJson(r.body);
              }
          }
