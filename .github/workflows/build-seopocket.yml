              /** Builds the list of queries to send to suggestion services for one seed. */
              public static List<String> buildQueries(String seed, boolean uk, boolean ru, boolean alpha, boolean questions,
                                                      boolean commerce, boolean cities, boolean prefix) {
                  LinkedHashSet<String> q = new LinkedHashSet<>();
                  String s = seed.trim().replaceAll("\\s+", " ");
                  if (s.isEmpty()) return new ArrayList<>(q);
                  q.add(s);
                  q.add(s + " ");
                  if (alpha) {
                      List<String> letters = new ArrayList<>();
                      if (uk) Collections.addAll(letters, ALPHA_UK);
                      if (ru) Collections.addAll(letters, ALPHA_RU);
                      Collections.addAll(letters, ALPHA_EN);
                      Collections.addAll(letters, DIGITS);
                      for (String l : new LinkedHashSet<>(letters)) {
                          q.add(s + " " + l);
                          if (prefix) q.add(l + " " + s);
                      }
                  }
                  if (questions) {
                      if (uk) for (String w : QUESTIONS_UK) q.add(w + " " + s);
                      if (ru) for (String w : QUESTIONS_RU) q.add(w + " " + s);
                  }
                  if (commerce) {
                      if (uk) for (String w : COMMERCE_UK) q.add(s + " " + w);
                      if (ru) for (String w : COMMERCE_RU) q.add(s + " " + w);
                  }
                  if (cities) {
                      if (uk) for (String w : CITIES_UK) q.add(s + " " + w);
                      if (ru) for (String w : CITIES_RU) q.add(s + " " + w);
                  }
                  return new ArrayList<>(q);
