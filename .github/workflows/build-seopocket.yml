              static String origin(String domainOrUrl) {
                  String u = Net.normalizeUrl(domainOrUrl);
                  java.util.regex.Matcher m = java.util.regex.Pattern.compile("^([a-z]+://[^/?#]+)", java.util.regex.Pattern.CASE_INSENSITIVE).matcher(u);
                  return m.find() ? m.group(1) : u;
              }

              void runRobots(final String domain, final String path, final TextView out) {
                  if (domain.trim().isEmpty()) { toast("Введите домен"); return; }
                  out.setText("Загружаю robots.txt…");
                  bg(new Runnable() { @Override public void run() {
                      String o = origin(domain);
                      List<Net.Resp> ch = Net.chain(o + "/robots.txt", 5, true);
                      Net.Resp r = ch.get(ch.size() - 1);
                      StringBuilder sb = new StringBuilder();
                      sb.append(o).append("/robots.txt → ").append(r.code).append(r.error != null ? " " + r.error : "").append('\n');
                      if (r.code == 200 && r.body != null) {
                          List<String> maps = new ArrayList<>();
                          List<SeoCore.RobotsGroup> g = SeoCore.parseRobots(r.body, maps);
                          sb.append("Групп правил: ").append(g.size()).append(" · Sitemap: ").append(maps.isEmpty() ? "не указан ⚠" : join(maps, ", ")).append("\n");
                          if (java.util.regex.Pattern.compile("(?im)^\\s*disallow:\\s*/\\s*$").matcher(r.body).find())
                              sb.append("✗ Похоже, сайт закрыт целиком (Disallow: /)\n");
                          String pth = path.trim().isEmpty() ? "/" : (path.trim().startsWith("/") ? path.trim() : "/" + path.trim());
                          sb.append("\nПуть ").append(pth).append(":\n");
                          String[][] bots = {{"Googlebot", "Googlebot"}, {"Googlebot-Image", "Googlebot-Image"}, {"Bingbot", "bingbot"}, {"Любой бот (*)", "anybot"}};
                          for (String[] b : bots) sb.append("  ").append(b[0]).append(": ").append(SeoCore.robotsVerdict(g, b[1], pth)).append('\n');
                          sb.append("\n──── robots.txt ────\n").append(r.body.length() > 6000 ? r.body.substring(0, 6000) + "\n…" : r.body);
                      } else sb.append(r.code == 404 ? "⚠ robots.txt нет — роботам разрешено всё\n" : "");
                      final String s = sb.toString();
                      ui(new Runnable() { @Override public void run() { out.setText(s); } });
                  } });
              }

              void runSitemap(final String domain, final TextView out, final boolean checkUrls) {
                  if (domain.trim().isEmpty()) { toast("Введите домен"); return; }
                  out.setText("Ищу карты сайта…");
                  bg(new Runnable() { @Override public void run() {
                      String o = origin(domain);
                      StringBuilder sb = new StringBuilder();
                      List<String> maps = new ArrayList<>();
                      Net.Resp rb = Net.chain(o + "/robots.txt", 5, true).get(0);
                      if (rb.code == 200 && rb.body != null) SeoCore.parseRobots(rb.body, maps);
                      if (maps.isEmpty()) maps.add(o + "/sitemap.xml");
                      List<String> urls = new ArrayList<>();
                      String newest = null, oldest = null;
                      int files = 0;
                      List<String> queue = new ArrayList<>(maps);
                      while (!queue.isEmpty() && files < 25) {
                          String sm = queue.remove(0);
                          List<Net.Resp> ch = Net.chain(sm, 5, true);
                          Net.Resp r = ch.get(ch.size() - 1);
                          files++;
                          sb.append(r.code).append("  ").append(sm);
                          if (r.body == null || r.code != 200) { sb.append("  ✗\n"); continue; }
                          if (sm.endsWith(".gz")) { sb.append("  (gz — не поддерживается)\n"); continue; }
                          SeoCore.SitemapInfo si = SeoCore.parseSitemap(r.body);
                          if (!si.childSitemaps.isEmpty()) { sb.append("  индекс: ").append(si.childSitemaps.size()).append(" карт\n"); queue.addAll(si.childSitemaps); }
                          else sb.append("  URL: ").append(si.urls.size()).append('\n');
                          urls.addAll(si.urls);
                          if (si.newestLastmod != null && (newest == null || si.newestLastmod.compareTo(newest) > 0)) newest = si.newestLastmod;
                          if (si.oldestLastmod != null && (oldest == null || si.oldestLastmod.compareTo(oldest) < 0)) oldest = si.oldestLastmod;
                      }
                      sb.append("\nВсего URL: ").append(urls.size()).append(" · файлов: ").append(files).append('\n');
                      if (newest != null) sb.append("lastmod: от ").append(oldest).append(" до ").append(newest).append('\n');
                      LinkedHashSet<String> uniq = new LinkedHashSet<>(urls);
                      if (uniq.size() != urls.size()) sb.append("⚠ Дублей: ").append(urls.size() - uniq.size()).append('\n');
                      int http = 0; for (String u : urls) if (u.startsWith("http://")) http++;
                      if (http > 0) sb.append("⚠ URL на http://: ").append(http).append('\n');
                      if (checkUrls && !urls.isEmpty()) {
                          sb.append("\nВыборочная проверка:\n");
                          List<String> sample = new ArrayList<>(uniq);
                          Collections.shuffle(sample);
                          for (String u : sample.subList(0, Math.min(20, sample.size()))) {
                              List<Net.Resp> ch = Net.chain(u, 5, false);
                              Net.Resp f = ch.get(ch.size() - 1);
                              sb.append(ch.size() == 1 && f.code == 200 ? "✓ " : "✗ ").append(ch.get(0).code).append(ch.size() > 1 ? "→" + f.code : "").append("  ").append(u).append('\n');
                          }
                      }
                      sb.append("\nПервые URL:\n");
                      int n = 0; for (String u : uniq) { if (n++ >= 40) break; sb.append(u).append('\n'); }
                      final String s = sb.toString();
                      ui(new Runnable() { @Override public void run() { out.setText(s); } });
                  } });
              }

