name: Build KeyTester APK
on:
  push:
    branches: [keytester]
    paths: ['keytester/**', '.github/workflows/keytester.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: keytester
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: KeyTester-apk
          path: keytester/app/build/outputs/apk/debug/app-debug.apk
      - name: Commit APK to branch
        working-directory: .
        run: |
          mkdir -p keytester-apk
          cp keytester/app/build/outputs/apk/debug/app-debug.apk keytester-apk/KeyTester.apk
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add keytester-apk/KeyTester.apk
          git commit -m "KeyTester APK [skip ci]" || exit 0
          git pull --rebase origin keytester
          git push origin HEAD:keytester
