              @Override public boolean onEvaluateFullscreenMode() { return false; }

              // ------------------------------------------------------------------ UI
              private int dp(float v) {
                  return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, getResources().getDisplayMetrics());
              }

              private int cBg()      { return dark ? 0xFF1B1E25 : 0xFFF4F6FA; }
              private int cLine()    { return dark ? 0xFF2C313C : 0xFFDDE2EA; }
              private int cText()    { return dark ? 0xFFEDEFF4 : 0xFF151B27; }
              private int cSub()     { return dark ? 0xFFA3ABBA : 0xFF5A6374; }
              private int cRipple()  { return dark ? 0x33FFFFFF : 0x22000000; }
              private int cChip()    { return dark ? 0xFF262A33 : 0xFFFFFFFF; }

              private RippleDrawable ripple(int fill, float radiusDp) {
                  GradientDrawable content = new GradientDrawable();
                  content.setColor(fill);
                  content.setCornerRadius(dp(radiusDp));
                  GradientDrawable mask = new GradientDrawable();
                  mask.setColor(0xFFFFFFFF);
                  mask.setCornerRadius(dp(radiusDp));
                  return new RippleDrawable(ColorStateList.valueOf(cRipple()), content, mask);
              }

              @Override public View onCreateCandidatesView() {
                  dark = (getResources().getConfiguration().uiMode & Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES;

                  LinearLayout outer = new LinearLayout(this);
                  outer.setOrientation(LinearLayout.VERTICAL);
                  outer.setBackgroundColor(cBg());
                  View topLine = new View(this);
                  topLine.setBackgroundColor(cLine());
                  outer.addView(topLine, new LinearLayout.LayoutParams(-1, Math.max(1, dp(0.7f))));

                  candidateBar = new LinearLayout(this);
                  candidateBar.setOrientation(LinearLayout.HORIZONTAL);
                  candidateBar.setGravity(Gravity.CENTER_VERTICAL);
                  candidateBar.setPadding(dp(6), dp(4), dp(6), dp(4));
                  outer.addView(candidateBar, new LinearLayout.LayoutParams(-1, dp(46)));

                  slotsBox = new LinearLayout(this);
                  slotsBox.setOrientation(LinearLayout.HORIZONTAL);
                  slotsBox.setGravity(Gravity.CENTER_VERTICAL);
                  candidateBar.addView(slotsBox, new LinearLayout.LayoutParams(0, -1, 1));

                  // order on screen: [2nd] | [1st — bold, centre] | [3rd]
                  for (int i = 0; i < 3; i++) {
                      TextView t = new TextView(this);
                      t.setGravity(Gravity.CENTER);
                      t.setSingleLine(true);
                      t.setEllipsize(TextUtils.TruncateAt.END);
                      t.setTextSize(TypedValue.COMPLEX_UNIT_SP, 17);
                      t.setTextColor(cText());
                      t.setPadding(dp(6), 0, dp(6), 0);
                      t.setBackground(ripple(0x00000000, 10));
                      slots[i] = t;
                  }
                  slots[0].setTypeface(Typeface.create("sans-serif-medium", Typeface.BOLD));
                  int[] order = {1, 0, 2};
                  for (int k = 0; k < 3; k++) {
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(0, -1, k == 1 ? 1.25f : 1f);
                      slotsBox.addView(slots[order[k]], lp);
                      if (k < 2) {
                          View dv = new View(this);
                          dv.setBackgroundColor(cLine());
                          LinearLayout.LayoutParams dl = new LinearLayout.LayoutParams(Math.max(1, dp(1)), dp(22));
                          slotsBox.addView(dv, dl);
                          dividers[k] = dv;
                      }
                  }

                  hintView = new TextView(this);
                  hintView.setGravity(Gravity.CENTER);
                  hintView.setTextSize(TypedValue.COMPLEX_UNIT_SP, 13);
                  hintView.setTextColor(cSub());
                  hintView.setText("Shift + Пробел — смена языка");
                  candidateBar.addView(hintView, 0, new LinearLayout.LayoutParams(0, -1, 1));

                  langPill = new TextView(this);
                  langPill.setGravity(Gravity.CENTER);
                  langPill.setTextSize(TypedValue.COMPLEX_UNIT_SP, 13);
                  langPill.setTypeface(Typeface.create("sans-serif-medium", Typeface.BOLD));
                  langPill.setIncludeFontPadding(false);
                  LinearLayout.LayoutParams pl = new LinearLayout.LayoutParams(dp(44), dp(30));
                  pl.leftMargin = dp(6);
                  candidateBar.addView(langPill, pl);
                  langPill.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) { switchLanguage(); }
                  });
                  langPill.setOnLongClickListener(new View.OnLongClickListener() {
                      @Override public boolean onLongClick(View v) {
                          Intent i = new Intent(TitanImeService.this, MainActivity.class);
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(i);
                          return true;
                      }
                  });

                  for (int i = 0; i < 3; i++) {
                      final int idx = i;
                      slots[i].setOnClickListener(new View.OnClickListener() {
                          @Override public void onClick(View v) { pickSuggestion(idx); }
                      });
                      slots[i].setOnLongClickListener(new View.OnLongClickListener() {
                          @Override public boolean onLongClick(View v) { return removeSuggestion(idx); }
                      });
                  }
                  updatePill(false);
                  return outer;
              }

              private int lang() { return LangBadge.clamp(prefs.getInt("language", 0)); }

              private void updatePill(boolean pulse) {
                  if (langPill == null) return;
                  int l = lang();
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(LangBadge.langColor(l));
                  bg.setCornerRadius(dp(15));
                  langPill.setBackground(new RippleDrawable(ColorStateList.valueOf(0x44FFFFFF), bg, null));
                  langPill.setTextColor(LangBadge.langTextColor(l));
                  langPill.setText(LangBadge.CODES[l]);
                  if (pulse) {
                      langPill.animate().cancel();
                      langPill.setScaleX(1.25f);
                      langPill.setScaleY(1.25f);
                      langPill.animate().scaleX(1f).scaleY(1f).setDuration(220).start();
                  }
              }

              @Override public void onStartInput(EditorInfo attribute, boolean restarting) {
                  super.onStartInput(attribute, restarting);
                  int cls = attribute == null ? 0 : attribute.inputType & InputType.TYPE_MASK_CLASS;
                  int var = attribute == null ? 0 : attribute.inputType & InputType.TYPE_MASK_VARIATION;
                  passwordField = cls == InputType.TYPE_CLASS_TEXT && (var == InputType.TYPE_TEXT_VARIATION_PASSWORD
                          || var == InputType.TYPE_TEXT_VARIATION_VISIBLE_PASSWORD || var == InputType.TYPE_TEXT_VARIATION_WEB_PASSWORD)
                          || cls == InputType.TYPE_CLASS_NUMBER && var == InputType.TYPE_NUMBER_VARIATION_PASSWORD;
                  if (!restarting && engine != null) engine.reloadLearned();   // picks up imported profiles
                  setCandidatesViewShown(true);
                  updatePill(false);
                  refreshSuggestions();
              }

              @Override public void onUpdateSelection(int oldSelStart, int oldSelEnd, int newSelStart, int newSelEnd,
                                                      int candidatesStart, int candidatesEnd) {
                  super.onUpdateSelection(oldSelStart, oldSelEnd, newSelStart, newSelEnd, candidatesStart, candidatesEnd);
                  refreshSuggestions();
              }

              // ------------------------------------------------------------------ keys
              @Override public boolean onKeyDown(int code, KeyEvent e) {
                  if (code == KeyEvent.KEYCODE_DEL) {
                      if (e.getRepeatCount() == 0 && !deleteHeld) {
                          deleteHeld = true;
                          deleteOne();
                          int interval = prefs.getInt("deleteRepeatMs", 100);
                          repeatHandler.postDelayed(deleteRepeat, Math.max(30, interval));
                      }
                      return true;
                  }
                  if (code == KeyEvent.KEYCODE_ALT_LEFT || code == KeyEvent.KEYCODE_ALT_RIGHT) { alt = true; return true; }
                  if (code == KeyEvent.KEYCODE_SHIFT_LEFT) { shiftLeft = true; return true; }
                  if (code == KeyEvent.KEYCODE_SHIFT_RIGHT) { shiftRight = true; return true; }
                  // SHIFT + SPACE — next language (the space itself is not typed)
                  if (code == KeyEvent.KEYCODE_SPACE && (shiftLeft || shiftRight || e.isShiftPressed())) {
                      if (e.getRepeatCount() == 0) { spaceCombo = true; switchLanguage(); }
                      return true;
                  }
                  if (isMapped(code)) { if (e.getRepeatCount() == 0) down.put(code, System.currentTimeMillis()); return true; }
                  return super.onKeyDown(code, e);
              }

              @Override public boolean onKeyUp(int code, KeyEvent e) {
                  if (code == KeyEvent.KEYCODE_DEL) {
                      deleteHeld = false;
                      repeatHandler.removeCallbacks(deleteRepeat);
                      return true;
                  }
                  if (code == KeyEvent.KEYCODE_ALT_LEFT || code == KeyEvent.KEYCODE_ALT_RIGHT) { alt = false; return true; }
                  if (code == KeyEvent.KEYCODE_SHIFT_LEFT) { shiftLeft = false; return true; }
                  if (code == KeyEvent.KEYCODE_SHIFT_RIGHT) { shiftRight = false; return true; }
                  if (code == KeyEvent.KEYCODE_SPACE && spaceCombo) { spaceCombo = false; down.remove(code); return true; }
                  if (!isMapped(code)) return super.onKeyUp(code, e);
                  Long start = down.remove(code);
                  long ms = start == null ? 0 : System.currentTimeMillis() - start;
                  boolean useAlt = alt || e.isAltPressed(), useShift = shiftLeft || shiftRight || e.isShiftPressed();
                  if (code == KeyEvent.KEYCODE_ENTER) { handleEnter(useShift); return true; }
                  int t1 = prefs.getInt("hold500", 500), t2 = prefs.getInt("hold1000", 1000);
                  String out = null;
                  if (t2 > 0 && ms >= t2) out = value(code, "hold1000");
                  else if (t1 > 0 && ms >= t1) out = value(code, "hold500");
                  if (out == null || out.isEmpty()) {
                      if (useAlt) {
                          out = value(code, "alt");
                          if (out == null || out.isEmpty()) out = altLegend(code);
                      } else {
                          out = value(code, "tap");
                      }
                  }
                  if (out == null || out.isEmpty()) out = defaultValue(code);
                  if (useShift && out != null && !out.isEmpty()) out = out.toUpperCase(Locale.ROOT);
                  if (out != null && !out.isEmpty()) commit(out);
                  return true;
              }

              private void switchLanguage() {
                  int next = (lang() + 1) % 3;   // Українська -> Русский -> English -> Українська
                  prefs.edit().putInt("language", next).apply();
                  updatePill(true);
                  if (badge != null) badge.show(next, candidateBar);
                  refreshSuggestions();
              }

              private String value(int code, String layer) {
                  String saved = prefs.getString("key_" + code + "_" + layer, "");
                  if (saved != null && !saved.isEmpty()) return saved;
                  if (code == KeyEvent.KEYCODE_U && layer.equals("alt")) return "_";
                  if (code == KeyEvent.KEYCODE_L && layer.equals("hold500")) return "Ж";
                  if (code == KeyEvent.KEYCODE_M && layer.equals("hold500")) return "ь";
                  if (code == KeyEvent.KEYCODE_S && layer.equals("hold500")) return "ы";
                  if (layer.equals("hold1000")) {
                      switch (code) {
                          case KeyEvent.KEYCODE_Q: return "0"; case KeyEvent.KEYCODE_R: return "3";
                          case KeyEvent.KEYCODE_S: return "4"; case KeyEvent.KEYCODE_W: return "1";
                          case KeyEvent.KEYCODE_X: return "8"; case KeyEvent.KEYCODE_Z: return "7";
                          case KeyEvent.KEYCODE_C: return "9"; case KeyEvent.KEYCODE_D: return "5";
                          case KeyEvent.KEYCODE_E: return "2"; case KeyEvent.KEYCODE_F: return "6";
                      }
                  }
                  return "";
              }

              private void handleEnter(boolean shifted) {
                  InputConnection ic = getCurrentInputConnection();
                  if (ic == null) return;
                  learnWordBeforeCursor("");
                  if (shifted) { ic.commitText("\n", 1); return; }
                  EditorInfo info = getCurrentInputEditorInfo();
                  if (info != null && info.actionId != 0) { ic.performEditorAction(info.actionId); return; }
                  int action = info == null ? EditorInfo.IME_ACTION_NONE : info.imeOptions & EditorInfo.IME_MASK_ACTION;
                  if (action != EditorInfo.IME_ACTION_NONE && action != EditorInfo.IME_ACTION_UNSPECIFIED) ic.performEditorAction(action);
                  else ic.commitText("\n", 1);
              }

              private void commit(String s) {
                  InputConnection ic = getCurrentInputConnection();
                  if (ic != null) {
                      ic.commitText(s, 1);
                      if (s.matches(".*[\\s.,!?;:()\\[\\]{}\"«»].*")) learnWordBeforeCursor(s);
                      refreshSuggestions();
                  }
              }

              /** After a space / punctuation the finished word is remembered (gets priority next time). */
              private void learnWordBeforeCursor(String justTyped) {
                  if (passwordField || engine == null) return;
                  InputConnection ic = getCurrentInputConnection();
                  if (ic == null) return;
                  CharSequence q = ic.getTextBeforeCursor(64, 0);
                  if (q == null) return;
                  String before = q.toString();
                  if (justTyped.isEmpty()) before = before + " ";
                  Matcher m = WORD_BEFORE_SEP.matcher(before);
                  if (m.find()) engine.learn(m.group(1), 1);
              }

              // ------------------------------------------------------------------ suggestions
              private String wordBeforeCursor() {
                  InputConnection ic = getCurrentInputConnection();
                  if (ic == null) return "";
                  CharSequence q = ic.getTextBeforeCursor(48, 0);
                  if (q == null) return "";
                  Matcher m = WORD_END.matcher(q);
                  return m.find() ? m.group(1) : "";
              }

              private void refreshSuggestions() {
                  if (candidateBar == null) return;
                  currentWord = passwordField ? "" : wordBeforeCursor();
                  List<String> res = currentWord.isEmpty() || engine == null
                          ? java.util.Collections.<String>emptyList()
                          : engine.suggest(currentWord, lang(), 3);
                  // Word is in no dictionary -> offer "+ word" in the right slot (one tap adds it to My dictionary)
                  String addWord = null;
                  if (!passwordField && engine != null && engine.dictsLoaded()) {
                      String clean = SuggestionEngine.cleanWord(currentWord);
                      if (clean != null && clean.equals(currentWord) && !engine.isKnown(clean)) addWord = clean;
                  }
                  if (addWord != null && res.size() > 2) res = new java.util.ArrayList<>(res.subList(0, 2));
                  boolean any = !res.isEmpty() || addWord != null;
                  hintView.setVisibility(any ? View.GONE : View.VISIBLE);
                  hintView.setText(passwordField ? "Подсказки выключены в поле пароля" : "Shift + Пробел — смена языка");
                  slotsBox.setVisibility(any ? View.VISIBLE : View.GONE);
                  for (int i = 0; i < 3; i++) {
                      if (i < res.size()) {
                          slots[i].setText(res.get(i));
                          slots[i].setTag(res.get(i));
                          slots[i].setEnabled(true);
                          slots[i].setTextColor(i == 0 ? cText() : cSub());
                      } else {
                          slots[i].setText("");
                          slots[i].setTag(null);
                          slots[i].setEnabled(false);
                      }
                  }
                  // the top suggestion is highlighted as a soft chip
                  slots[0].setBackground(res.isEmpty() ? ripple(0x00000000, 10) : ripple(cChip(), 10));
                  slots[2].setBackground(ripple(0x00000000, 10));
                  if (addWord != null) {
                      slots[2].setText("+ " + addWord);
                      slots[2].setTag(new AddTag(addWord));
                      slots[2].setEnabled(true);
                      slots[2].setTextColor(dark ? 0xFF8AB4FF : LangBadge.langColor(lang()));
                      slots[2].setBackground(outlineChip(dark ? 0xFF8AB4FF : LangBadge.langColor(lang())));
                  }
                  int filled = res.size() + (addWord != null ? 1 : 0);
                  for (View dv : dividers) if (dv != null) dv.setVisibility(filled > 1 && addWord == null ? View.VISIBLE : View.INVISIBLE);
                  setCandidatesViewShown(true);
              }

              private RippleDrawable outlineChip(int color) {
                  GradientDrawable content = new GradientDrawable();
                  content.setColor((color & 0x00FFFFFF) | 0x14000000);
                  content.setStroke(Math.max(1, dp(1.2f)), color);
                  content.setCornerRadius(dp(10));
                  GradientDrawable mask = new GradientDrawable();
                  mask.setColor(0xFFFFFFFF);
                  mask.setCornerRadius(dp(10));
                  return new RippleDrawable(ColorStateList.valueOf(cRipple()), content, mask);
              }

              private void toast(String s) { Toast.makeText(this, s, Toast.LENGTH_SHORT).show(); }

              /** Long press on a suggestion removes it from My dictionary / learned words. */
              private boolean removeSuggestion(int idx) {
                  Object tag = slots[idx].getTag();
                  if (!(tag instanceof String) || engine == null) return false;
                  String w = (String) tag;
                  if (engine.isUserWord(w)) { engine.removeUserWord(w); engine.forget(w); toast("«" + w + "» удалено из моего словаря"); }
                  else if (engine.isLearned(w)) { engine.forget(w); toast("«" + w + "» больше не будет подниматься"); }
                  else { toast("Это слово из встроенного словаря"); return true; }
                  refreshSuggestions();
                  return true;
              }

              private void pickSuggestion(int idx) {
                  Object tag = slots[idx].getTag();
                  if (tag instanceof AddTag) {
                      String w = ((AddTag) tag).word;
                      if (engine != null && engine.addUserWord(w)) toast("«" + w + "» добавлено в мой словарь");
                      refreshSuggestions();
                      return;
                  }
                  if (!(tag instanceof String)) return;
                  String word = (String) tag;
                  InputConnection ic = getCurrentInputConnection();
                  if (ic == null) return;
                  String typed = wordBeforeCursor();
                  CharSequence after = ic.getTextAfterCursor(1, 0);
                  boolean spaceAfter = after != null && after.length() > 0 && Character.isWhitespace(after.charAt(0));
                  ic.beginBatchEdit();
                  if (!typed.isEmpty()) ic.deleteSurroundingText(typed.length(), 0);
                  ic.commitText(spaceAfter ? word : word + " ", 1);
                  ic.endBatchEdit();
                  engine.learn(word, 3);
                  refreshSuggestions();
              }

              private void deleteOne() {
                  InputConnection ic = getCurrentInputConnection();
                  if (ic != null) {
                      CharSequence sel = ic.getSelectedText(0);
                      if (sel != null && sel.length() > 0) ic.commitText("", 1);
                      else ic.deleteSurroundingText(1, 0);
                  }
                  refreshSuggestions();
              }

              @Override public void onFinishInput() {
                  deleteHeld = false;
                  repeatHandler.removeCallbacks(deleteRepeat);
                  super.onFinishInput();
              }

              private boolean isMapped(int k) {
                  return (k >= KeyEvent.KEYCODE_A && k <= KeyEvent.KEYCODE_Z) || k == KeyEvent.KEYCODE_SPACE
                          || k == KeyEvent.KEYCODE_SYM || k == KeyEvent.KEYCODE_ENTER || k == KeyEvent.KEYCODE_DEL;
              }

              private String defaultValue(int code) {
                  if (code == KeyEvent.KEYCODE_SPACE) return " ";
                  if (code == KeyEvent.KEYCODE_SYM) return "ю";
                  if (code >= KeyEvent.KEYCODE_A && code <= KeyEvent.KEYCODE_Z) {
                      char en = (char) ('a' + code - KeyEvent.KEYCODE_A);
                      int lang = prefs.getInt("language", 0);
                      if (lang == 2) return String.valueOf(en);
                      String keys = "qwertyuiopasdfghjklzxcvbnm", ua = "йцукенгшщзфівапролдячсмить", ru = "йцукенгшщзфывапролдячсмить";
                      int i = keys.indexOf(en);
                      String m = lang == 0 ? ua : ru;
                      return i >= 0 && i < m.length() ? String.valueOf(m.charAt(i)) : String.valueOf(en);
                  }
                  return "";
              }

              private String altLegend(int code) {
                  if (code < KeyEvent.KEYCODE_A || code > KeyEvent.KEYCODE_Z) return null;
                  char c = (char) ('a' + code - KeyEvent.KEYCODE_A);
                  switch (c) {
                      case 'q': return "0"; case 'w': return "1"; case 'e': return "2"; case 'r': return "3";
                      case 't': return "("; case 'y': return ")"; case 'u': return "_"; case 'i': return null;
                      case 'o': return "+"; case 'p': return "0"; case 'a': return "*"; case 's': return "4";
                      case 'd': return "5"; case 'f': return "6"; case 'g': return "/"; case 'h': return ":";
                      case 'j': return "#"; case 'k': return "'"; case 'l': return "\""; case 'z': return "7";
                      case 'x': return "8"; case 'c': return "9"; case 'v': return "?"; case 'b': return "!";
                      case 'n': return ","; case 'm': return ".";
                  }
                  return null;
              }
          }
