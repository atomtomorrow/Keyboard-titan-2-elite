          package com.ievhenii.titankeyboard;

          import android.content.Context;
          import android.content.SharedPreferences;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.HashMap;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;

          /**
           * Offline multilingual word suggestions (UA / RU / EN).
           * - frequency dictionaries in assets (dict_uk.txt, dict_ru.txt, dict_en.txt), most frequent first
           * - completion of the word being typed + correction of one typo
           * - personal words: everything you type is learned locally (prefs "word_*", included in profile export)
           * - script detection: Latin letters -> English, Cyrillic -> current language first, then the other Cyrillic one
           */
          final class SuggestionEngine {
              static final int UA = 0, RU = 1, EN = 2;
              private static final String[] FILES = {"dict_uk.txt", "dict_ru.txt", "dict_en.txt"};

              private static final class Dict {
                  final String[] words;     // normalised (lowercase), in frequency order
                  final String[] display;   // as written in the dictionary (keeps ё, apostrophes, capitals of names)
                  final java.util.HashSet<String> set;
                  Dict(String[] w, String[] d) { words = w; display = d; set = new java.util.HashSet<>(java.util.Arrays.asList(w)); }
              }

              private final Context ctx;
              private final SharedPreferences prefs;
              private final Dict[] dicts = new Dict[3];
              private final Map<String, Integer> learned = new HashMap<>();
              /** My dictionary: words added by hand (prefs "udict_<word>" = word as written). */
              private final Map<String, String> userWords = new HashMap<>();

              SuggestionEngine(Context ctx, SharedPreferences prefs) { this(ctx, prefs, true); }

              SuggestionEngine(Context ctx, SharedPreferences prefs, boolean async) {
                  this.ctx = ctx.getApplicationContext();
                  this.prefs = prefs;
                  reloadLearned();
                  if (async) new Thread(new Runnable() {
                      @Override public void run() { loadAll(); }
                  }, "dict-loader").start();
              }

              void loadAll() { for (int i = 0; i < 3; i++) load(i); }

              private void load(int lang) {
                  ArrayList<String> w = new ArrayList<>(), d = new ArrayList<>();
                  java.util.HashSet<String> seen = new java.util.HashSet<>();
                  try (BufferedReader r = new BufferedReader(new InputStreamReader(ctx.getAssets().open(FILES[lang]), StandardCharsets.UTF_8))) {
                      String line;
                      while ((line = r.readLine()) != null) {
                          line = line.trim();
                          if (line.isEmpty() || line.startsWith("#")) continue;
                          String n = norm(line);
                          if (seen.add(n)) { w.add(n); d.add(line.replace('’', '\'')); }
                      }
                  } catch (Exception ignored) { }
                  synchronized (dicts) { dicts[lang] = new Dict(w.toArray(new String[0]), d.toArray(new String[0])); }
              }

              static String norm(String s) {
                  return s.toLowerCase(Locale.ROOT).replace('ё', 'е').replace('’', '\'').replace('ʼ', '\'');
              }

              synchronized void reloadLearned() {
                  learned.clear();
                  userWords.clear();
                  if (prefs == null) return;
                  for (Map.Entry<String, ?> e : prefs.getAll().entrySet()) {
                      if (e.getKey().startsWith("word_") && e.getValue() instanceof Integer) {
                          learned.put(e.getKey().substring(5), (Integer) e.getValue());
                      } else if (e.getKey().startsWith("udict_") && e.getValue() instanceof String) {
                          userWords.put(e.getKey().substring(6), (String) e.getValue());
                      }
                  }
              }

              /** Cleans a word typed by the user: trims spaces/punctuation around it. Returns null if it is not a word. */
              static String cleanWord(String raw) {
                  if (raw == null) return null;
                  String w = raw.trim().replace('’', '\'').replace('ʼ', '\'');
                  w = w.replaceAll("^[^\\p{L}]+|[^\\p{L}]+$", "");
                  if (w.length() < 2 || w.length() > 32) return null;
                  if (!w.matches("[\\p{L}][\\p{L}'-]*")) return null;
                  return w;
              }

              /** Adds a word to my dictionary; returns false if it is not a word or already there. */
              synchronized boolean addUserWord(String raw) {
                  String w = cleanWord(raw);
                  if (w == null) return false;
                  String n = norm(w);
                  if (w.equals(userWords.get(n))) return false;
                  userWords.put(n, w);
                  if (prefs != null) prefs.edit().putString("udict_" + n, w).apply();
                  return true;
              }

              synchronized boolean removeUserWord(String word) {
                  String n = norm(word);
                  boolean had = userWords.remove(n) != null;
                  if (prefs != null) prefs.edit().remove("udict_" + n).apply();
                  return had;
              }

              synchronized boolean isUserWord(String word) { return userWords.containsKey(norm(word)); }

              synchronized boolean isLearned(String word) { return learned.containsKey(norm(word)); }

              synchronized List<String> userWordList() {
                  ArrayList<String> l = new ArrayList<>(userWords.values());
                  Collections.sort(l, String.CASE_INSENSITIVE_ORDER);
                  return l;
              }

              /** True if the word is in a built-in dictionary or in my dictionary. */
              boolean isKnown(String word) {
                  String n = norm(word);
                  synchronized (this) { if (userWords.containsKey(n)) return true; }
                  synchronized (dicts) {
                      for (Dict d : dicts) if (d != null && d.set.contains(n)) return true;
                  }
                  return false;
              }

              boolean dictsLoaded() { synchronized (dicts) { return dicts[0] != null && dicts[1] != null && dicts[2] != null; } }

              /** Words you type often (2+ times) that are in no dictionary yet: {word, count}. */
              synchronized List<String[]> frequentUnknown(int max) {
                  ArrayList<Map.Entry<String, Integer>> all = new ArrayList<>(learned.entrySet());
                  Collections.sort(all, new Comparator<Map.Entry<String, Integer>>() {
                      @Override public int compare(Map.Entry<String, Integer> a, Map.Entry<String, Integer> b) {
                          return Integer.compare(b.getValue(), a.getValue());
                      }
                  });
                  ArrayList<String[]> out = new ArrayList<>();
                  for (Map.Entry<String, Integer> e : all) {
                      if (e.getValue() < 2) break;
                      if (isKnown(e.getKey())) continue;
                      out.add(new String[]{e.getKey(), String.valueOf(e.getValue())});
                      if (out.size() >= max) break;
                  }
                  return out;
              }

              synchronized void learn(String word, int amount) {
                  if (word == null) return;
                  String w = norm(word);
                  if (w.length() < 2 || w.length() > 32) return;
                  int n = Math.min(10000, (learned.containsKey(w) ? learned.get(w) : 0) + amount);
                  learned.put(w, n);
                  if (prefs != null) prefs.edit().putInt("word_" + w, n).apply();
              }

              synchronized void forget(String word) {
                  String w = norm(word);
                  learned.remove(w);
                  if (prefs != null) prefs.edit().remove("word_" + w).apply();
              }

              static boolean isLatin(String s) {
                  for (int i = 0; i < s.length(); i++) {
                      char c = s.charAt(i);
                      if ((c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z')) return true;
                  }
                  return false;
              }

              /** Learned words belong to a script, not to a language: Latin vs Cyrillic. */
              private static boolean sameScript(String a, boolean latin) { return isLatin(a) == latin; }

              synchronized List<String> suggest(String typed, int lang, int max) {
                  ArrayList<String> out = new ArrayList<>();
                  if (typed == null || typed.isEmpty()) return out;
                  String p = norm(typed);
                  boolean latin = isLatin(p);
                  int primary, secondary;
                  if (latin) { primary = EN; secondary = -1; }
                  else {
                      primary = (lang == RU) ? RU : UA;
                      // Letters that exist only in one language decide which dictionary goes first
                      if (p.matches(".*[іїєґ].*")) primary = UA;
                      else if (p.matches(".*[ыэъ].*")) primary = RU;
                      secondary = primary == UA ? RU : UA;
                  }

                  final Map<String, Double> score = new LinkedHashMap<>();
                  final Map<String, String> show = new HashMap<>();
                  Dict d1, d2;
                  synchronized (dicts) { d1 = dicts[primary]; d2 = secondary >= 0 ? dicts[secondary] : null; }
                  scan(d1, p, 1.0, score, show);
                  if (d2 != null) scan(d2, p, 0.12, score, show);

                  // my dictionary: always strong
                  for (Map.Entry<String, String> e : userWords.entrySet()) {
                      String w = e.getKey();
                      if (!sameScript(w, latin)) continue;
                      double kind = matchKind(p, w);
                      if (kind <= 0) continue;
                      double s = kind * 30000.0;
                      Double old = score.get(w);
                      if (old == null || old < s) score.put(w, s);
                      show.put(w, e.getValue());
                  }

                  // personal words
                  for (Map.Entry<String, Integer> e : learned.entrySet()) {
                      String w = e.getKey();
                      if (!sameScript(w, latin)) continue;
                      int cnt = e.getValue();
                      double kind = matchKind(p, w);
                      if (kind <= 0) continue;
                      boolean known = score.containsKey(w);
                      if (!known && cnt < 2) continue;            // one-off typos are not suggested
                      double boost = Math.min(250000, cnt * 6000.0) * kind;
                      score.put(w, (known ? score.get(w) : 0) + boost);
                      if (!show.containsKey(w)) show.put(w, w);
                  }

                  ArrayList<String> keys = new ArrayList<>(score.keySet());
                  Collections.sort(keys, new Comparator<String>() {
                      @Override public int compare(String a, String b) { return Double.compare(score.get(b), score.get(a)); }
                  });
                  for (String k : keys) {
                      String disp = applyCase(typed, show.get(k));
                      if (!out.contains(disp)) out.add(disp);
                      if (out.size() >= max) break;
                  }
                  // The word that is already typed in full is not useful in the main (centre) slot
                  if (out.size() > 1 && out.get(0).equalsIgnoreCase(typed) && norm(out.get(1)).startsWith(p)) {
                      String first = out.remove(0);
                      out.add(1, first);
                  }
                  return out;
              }

              private void scan(Dict d, String p, double weight, Map<String, Double> score, Map<String, String> show) {
                  if (d == null) return;
                  int n = d.words.length;
                  for (int i = 0; i < n; i++) {
                      String w = d.words[i];
                      double kind = matchKind(p, w);
                      if (kind <= 0) continue;
                      double s = weight * kind * 1000000.0 / (i + 40);
                      Double old = score.get(w);
                      if (old == null || old < s) { score.put(w, s); show.put(w, d.display[i]); }
                  }
              }

              /**
               * 1.0  – the word starts with what was typed (completion / exact)
               * 0.07 – one typo in the beginning of a longer word
               * 0.16 – the whole word with one typo (substitution, extra/missing letter, swapped letters)
               * 0    – no match
               */
              static double matchKind(String p, String w) {
                  int lp = p.length(), lw = w.length();
                  if (lw >= lp && w.startsWith(p)) return 1.0;
                  if (lp >= 3 && Math.abs(lw - lp) <= 1 && within1(p, w)) return 0.16;
                  if (lp >= 4 && lw > lp && within1(p, w.substring(0, lp))) return 0.07;
                  return 0;
              }

              /** Damerau distance <= 1 */
              static boolean within1(String a, String b) {
                  int la = a.length(), lb = b.length();
                  if (Math.abs(la - lb) > 1) return false;
                  if (a.equals(b)) return true;
                  if (a.charAt(0) != b.charAt(0) && !(la > 1 && lb > 1 && a.charAt(0) == b.charAt(1) && a.charAt(1) == b.charAt(0))) {
                      // a typo in the very first letter is rare on a physical keyboard; only allow it for transpositions
                      return false;
                  }
                  if (la == lb) {
                      int i = 0;
                      while (i < la && a.charAt(i) == b.charAt(i)) i++;
                      if (i == la) return true;
                      if (a.substring(i + 1).equals(b.substring(i + 1))) return true;                 // substitution
                      return i + 1 < la && a.charAt(i) == b.charAt(i + 1) && a.charAt(i + 1) == b.charAt(i)
                              && a.substring(i + 2).equals(b.substring(i + 2));                       // swap
                  }
                  String s = la < lb ? a : b, l = la < lb ? b : a;
                  int i = 0;
                  while (i < s.length() && s.charAt(i) == l.charAt(i)) i++;
                  return s.substring(i).equals(l.substring(i + 1));                                 // insertion / deletion
              }

              /** "При" -> "Привет", "ПРИ" -> "ПРИВЕТ", "при" -> "привет" (names from the dictionary keep their capital). */
              static String applyCase(String typed, String word) {
                  if (word == null || word.isEmpty()) return word;
                  int letters = 0, upper = 0;
                  for (int i = 0; i < typed.length(); i++) {
                      char c = typed.charAt(i);
                      if (Character.isLetter(c)) { letters++; if (Character.isUpperCase(c)) upper++; }
                  }
                  if (letters >= 2 && upper == letters) return word.toUpperCase(Locale.ROOT);
                  if (letters >= 1 && Character.isUpperCase(typed.charAt(0)))
                      return word.substring(0, 1).toUpperCase(Locale.ROOT) + word.substring(1);
                  return word;
              }
          }
