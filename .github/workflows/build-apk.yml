name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Write source (TitanCustomKeyboard 0.7.0)
        run: |
          mkdir -p TitanCustomKeyboard TitanCustomKeyboard/app TitanCustomKeyboard/app/src/main TitanCustomKeyboard/app/src/main/assets TitanCustomKeyboard/app/src/main/java/com/ievhenii/titankeyboard TitanCustomKeyboard/app/src/main/res/values TitanCustomKeyboard/app/src/main/res/xml
          cat > 'TitanCustomKeyboard/settings.gradle' <<'EOF_TCK'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'TitanCustomKeyboard'
          include ':app'
          EOF_TCK
          cat > 'TitanCustomKeyboard/build.gradle' <<'EOF_TCK'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF_TCK
          cat > 'TitanCustomKeyboard/gradle.properties' <<'EOF_TCK'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF_TCK
          cat > 'TitanCustomKeyboard/app/build.gradle' <<'EOF_TCK'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.ievhenii.titankeyboard'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.ievhenii.titankeyboard'
                  minSdk 26
                  targetSdk 35
                  versionCode 7
                  versionName '0.7.0'
              }
          }
          EOF_TCK
          cat > 'TitanCustomKeyboard/app/src/main/AndroidManifest.xml' <<'EOF_TCK'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <application
                  android:allowBackup="true"
                  android:label="Titan Custom Keyboard"
                  android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".TitanImeService"
                      android:label="Titan Custom Keyboard"
                      android:permission="android.permission.BIND_INPUT_METHOD"
                      android:exported="true">
                      <intent-filter><action android:name="android.view.InputMethod" /></intent-filter>
                      <meta-data android:name="android.view.im" android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF_TCK
          cat > 'TitanCustomKeyboard/app/src/main/res/values/strings.xml' <<'EOF_TCK'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Клавиатура для Титана</string>
          </resources>
          EOF_TCK
          cat > 'TitanCustomKeyboard/app/src/main/res/values/styles.xml' <<'EOF_TCK'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#3759A5</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
              </style>
          </resources>
          EOF_TCK
          cat > 'TitanCustomKeyboard/app/src/main/res/xml/method.xml' <<'EOF_TCK'
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:supportsSwitchingToNextInputMethod="false" />
          EOF_TCK
          cat > 'TitanCustomKeyboard/app/src/main/java/com/ievhenii/titankeyboard/LangBadge.java' <<'EOF_TCK'
          package com.ievhenii.titankeyboard;

          import android.content.Context;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.view.animation.DecelerateInterpolator;
          import android.view.animation.OvershootInterpolator;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.PopupWindow;
          import android.widget.TextView;
          import android.widget.Toast;

          /**
           * Round language badge (UA / RU / EN) that pops up in the middle of the screen
           * every time the layout changes.
           *
           * 1) If "display over other apps" is allowed — a system overlay window (works everywhere).
           * 2) Otherwise — a PopupWindow attached to the suggestion bar of the keyboard.
           * 3) If neither is possible — a short Toast.
           */
          final class LangBadge {
              static final String[] CODES = {"UA", "RU", "EN"};
              static final String[] NAMES = {"Українська", "Русский", "English"};
              static final int[] BG = {0xFF0057B7, 0xFF3A4150, 0xFF6D3BEF};
              static final int[] FG = {0xFFFFD500, 0xFFFFFFFF, 0xFFFFFFFF};

              private final Context ctx;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private static final class Holder { FrameLayout root; View circle; TextView code, name; }
              private Holder overlay, pop, active;
              private boolean overlayAdded = false;
              private PopupWindow popup;
              private final Runnable hide = new Runnable() {
                  @Override public void run() { fadeOut(); }
              };

              LangBadge(Context ctx) { this.ctx = ctx; }

              static int langColor(int lang) { return BG[clamp(lang)]; }
              static int langTextColor(int lang) { return FG[clamp(lang)]; }
              static int clamp(int lang) { return Math.max(0, Math.min(2, lang)); }

              private int dp(float v) {
                  return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, ctx.getResources().getDisplayMetrics());
              }

              private Holder buildView() {
                  Holder h = new Holder();
                  FrameLayout root = new FrameLayout(ctx);
                  int pad = dp(16);
                  root.setPadding(pad, pad, pad, pad);   // room for the shadow

                  LinearLayout c = new LinearLayout(ctx);
                  c.setOrientation(LinearLayout.VERTICAL);
                  c.setGravity(Gravity.CENTER);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setShape(GradientDrawable.OVAL);
                  bg.setColor(BG[0]);
                  bg.setStroke(dp(3), 0x55FFFFFF);
                  c.setBackground(bg);
                  c.setElevation(dp(10));

                  TextView code = new TextView(ctx);
                  code.setTextSize(TypedValue.COMPLEX_UNIT_SP, 34);
                  code.setTypeface(Typeface.create("sans-serif-medium", Typeface.BOLD));
                  code.setGravity(Gravity.CENTER);
                  code.setIncludeFontPadding(false);
                  c.addView(code, new LinearLayout.LayoutParams(-2, -2));

                  TextView name = new TextView(ctx);
                  name.setTextSize(TypedValue.COMPLEX_UNIT_SP, 11);
                  name.setGravity(Gravity.CENTER);
                  name.setPadding(0, dp(3), 0, 0);
                  c.addView(name, new LinearLayout.LayoutParams(-2, -2));

                  int size = dp(108);
                  root.addView(c, new FrameLayout.LayoutParams(size, size, Gravity.CENTER));
                  h.root = root; h.circle = c; h.code = code; h.name = name;
                  return h;
              }

              private void bind(Holder h, int lang) {
                  lang = clamp(lang);
                  GradientDrawable bg = (GradientDrawable) h.circle.getBackground();
                  bg.setColor(BG[lang]);
                  h.code.setText(CODES[lang]);
                  h.code.setTextColor(FG[lang]);
                  h.name.setText(NAMES[lang]);
                  h.name.setTextColor((FG[lang] & 0x00FFFFFF) | 0xCC000000);
              }

              private boolean canOverlay() {
                  return Build.VERSION.SDK_INT >= 23 && Settings.canDrawOverlays(ctx);
              }

              /** anchor — any view of the keyboard window (the suggestion bar); may be null. */
              void show(int lang, View anchor) {
                  handler.removeCallbacks(hide);
                  try {
                      if (canOverlay()) { showOverlay(lang); return; }
                  } catch (Exception ignored) { overlayAdded = false; }
                  try {
                      if (anchor != null && anchor.isAttachedToWindow() && anchor.getWindowToken() != null) {
                          showPopup(lang, anchor); return;
                      }
                  } catch (Exception ignored) { }
                  Toast.makeText(ctx, CODES[clamp(lang)] + " · " + NAMES[clamp(lang)], Toast.LENGTH_SHORT).show();
              }

              private void showOverlay(int lang) {
                  WindowManager wm = (WindowManager) ctx.getSystemService(Context.WINDOW_SERVICE);
                  if (popup != null && popup.isShowing()) { try { popup.dismiss(); } catch (Exception ignored) { } }
                  if (overlay == null) overlay = buildView();
                  bind(overlay, lang);
                  active = overlay;
                  if (!overlayAdded) {
                      WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                              WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                              WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                      | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                              PixelFormat.TRANSLUCENT);
                      lp.gravity = Gravity.CENTER;
                      lp.y = -dp(60);
                      wm.addView(overlay.root, lp);
                      overlayAdded = true;
                  }
                  popIn();
              }

              private void showPopup(int lang, View anchor) {
                  if (popup == null) {
                      pop = buildView();
                      popup = new PopupWindow(pop.root, -2, -2, false);
                      popup.setTouchable(false);
                      popup.setClippingEnabled(false);
                      popup.setAnimationStyle(0);
                      popup.setBackgroundDrawable(null);
                  }
                  bind(pop, lang);
                  active = pop;
                  if (!popup.isShowing()) {
                      int screenH = ctx.getResources().getDisplayMetrics().heightPixels;
                      // Badge centre roughly in the middle of the screen, measured from the bottom edge
                      int y = Math.max(anchor.getHeight() + dp(40), screenH / 2 - dp(70));
                      popup.showAtLocation(anchor, Gravity.CENTER_HORIZONTAL | Gravity.BOTTOM, 0, y);
                  }
                  popIn();
              }

              private void popIn() {
                  View circle = active.circle;
                  circle.animate().cancel();
                  circle.setAlpha(0f);
                  circle.setScaleX(0.55f);
                  circle.setScaleY(0.55f);
                  circle.animate().alpha(1f).scaleX(1f).scaleY(1f).setDuration(220)
                          .setInterpolator(new OvershootInterpolator(1.6f)).start();
                  handler.postDelayed(hide, 900);
              }

              private void fadeOut() {
                  if (active == null) return;
                  View circle = active.circle;
                  circle.animate().cancel();
                  circle.animate().alpha(0f).scaleX(0.85f).scaleY(0.85f).setDuration(240)
                          .setInterpolator(new DecelerateInterpolator())
                          .withEndAction(new Runnable() { @Override public void run() { removeAll(); } })
                          .start();
              }

              void removeAll() {
                  handler.removeCallbacks(hide);
                  try {
                      if (overlayAdded && overlay != null) {
                          ((WindowManager) ctx.getSystemService(Context.WINDOW_SERVICE)).removeView(overlay.root);
                      }
                  } catch (Exception ignored) { }
                  overlayAdded = false;
                  try { if (popup != null && popup.isShowing()) popup.dismiss(); } catch (Exception ignored) { }
              }

              static int textOn(int bg) {
                  int r = Color.red(bg), g = Color.green(bg), b = Color.blue(bg);
                  return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? 0xFF111111 : 0xFFFFFFFF;
              }
          }
          EOF_TCK
          cat > 'TitanCustomKeyboard/app/src/main/java/com/ievhenii/titankeyboard/MainActivity.java' <<'EOF_TCK'
          package com.ievhenii.titankeyboard;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.net.Uri;
          import android.graphics.Typeface;
          import android.text.InputType;
          import android.view.KeyEvent;
          import android.widget.*;
          import java.util.*;
          import org.json.JSONObject;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {
              private SharedPreferences p;
              private LinearLayout root, rowsRoot;
              private boolean detecting=false;
              private static final int REQ_EXPORT=7101, REQ_IMPORT=7102;
              private TextView detectStatus, overlayStatus;
              private LangBadge testBadge;
              private SuggestionEngine dictEngine;
              private LinearLayout userList, freqList;
              private TextView userCount;
              private final List<Row> rows=new ArrayList<>();
              static class Row { int code; String label; EditText[] f=new EditText[6]; Row(int c,String l){code=c;label=l;} }
              private static final int[] CODES=new int[28];
              private static final String[] NAMES=new String[28];
              static {
                  String alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
                  for(int i=0;i<26;i++){ CODES[i]=29+i; NAMES[i]=String.valueOf(alphabet.charAt(i)); }
                  CODES[26]=62; NAMES[26]="Пробел";
                  CODES[27]=63; NAMES[27]="SYM — ю";
              }
              private final String[] layers={"tap","alt","sym","shift","hold500","hold1000"};
              private final String[] hints={"Коротко","ALT","SYM","SHIFT","0,5 сек","1 сек"};
              @Override public void onCreate(Bundle b){super.onCreate(b);p=getSharedPreferences("keyboard",MODE_PRIVATE);build();}
              @Override public boolean dispatchKeyEvent(KeyEvent e){
                  if(detecting && e.getAction()==KeyEvent.ACTION_DOWN && e.getRepeatCount()==0){
                      int c=e.getKeyCode(); detecting=false;
                      detectStatus.setText("Определена клавиша: "+KeyEvent.keyCodeToString(c)+" (код "+c+")"+(isExcluded(c)?" — исключена из списка по настройкам":""));
                      return true;
                  }
                  return super.dispatchKeyEvent(e);
              }
              private boolean isExcluded(int c){return (c>=7&&c<=16)||(c>=68&&c<=76)||c==55||c==56;}
              private void build(){
                  ScrollView sv=new ScrollView(this); root=new LinearLayout(this); root.setOrientation(1); root.setPadding(20,18,20,30); sv.addView(root); root.setBackgroundColor(0xfff3f5f8); setContentView(sv);
                  root.addView(label("Titan Custom Keyboard 0.7.0",24,true)); root.addView(label("Редактор физических клавиш Titan 2 Elite",14,false));
                  section("Язык ввода");
                  Spinner lang=new Spinner(this);
                  lang.setAdapter(new ArrayAdapter<>(this,android.R.layout.simple_spinner_dropdown_item,new String[]{"Українська","Русский","English"}));
                  lang.setSelection(p.getInt("language",0)); root.addView(lang);
                  root.addView(label("Быстрое переключение прямо при наборе: зажми SHIFT и нажми ПРОБЕЛ. Порядок: Українська → Русский → English → Українська. Ещё можно нажать на цветной значок языка справа в панели подсказок. Долгое нажатие на значок открывает эти настройки.",12,false));
                  section("Круглый значок смены языка");
                  root.addView(label("При каждой смене языка в центре экрана на секунду появляется круглый значок UA / RU / EN. Чтобы он показывался поверх любого приложения, разреши «Показ поверх других окон». Без разрешения значок появляется над панелью подсказок.",12,false));
                  overlayStatus=label("",13,true); root.addView(overlayStatus);
                  Button ov=new Button(this); ov.setText("РАЗРЕШИТЬ ПОКАЗ ПОВЕРХ ДРУГИХ ОКОН"); root.addView(ov);
                  ov.setOnClickListener(v->{try{startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,Uri.parse("package:"+getPackageName())));}catch(Exception ex){startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION));}});
                  Button test=new Button(this); test.setText("ПОКАЗАТЬ ЗНАЧОК (ПРОВЕРКА)"); root.addView(test);
                  test.setOnClickListener(v->{if(testBadge==null)testBadge=new LangBadge(this);testBadge.show(lang.getSelectedItemPosition(),null);});
                  updateOverlayStatus();
                  section("Мой словарь");
                  root.addView(label("Свои слова (имена, названия, термины, сленг) всегда предлагаются первыми. Добавить можно здесь — по одному или сразу списком, — или прямо при наборе: если слова нет в словаре, справа в панели подсказок появится «+ слово», нажми на него. Долгое нажатие на подсказку убирает слово из словаря.",12,false));
                  EditText addField=new EditText(this);
                  addField.setHint("Слова через пробел, запятую или с новой строки");
                  addField.setMinLines(2);
                  addField.setInputType(InputType.TYPE_CLASS_TEXT|InputType.TYPE_TEXT_FLAG_MULTI_LINE|InputType.TYPE_TEXT_FLAG_NO_SUGGESTIONS);
                  root.addView(addField);
                  Button addBtn=new Button(this); addBtn.setText("ДОБАВИТЬ В МОЙ СЛОВАРЬ"); root.addView(addBtn);
                  dictEngine=new SuggestionEngine(this,p,false);
                  addBtn.setOnClickListener(v->{
                      int n=0,bad=0;
                      for(String w:addField.getText().toString().split("[\\s,;]+")){ if(w.trim().isEmpty())continue; if(dictEngine.addUserWord(w))n++; else bad++; }
                      addField.setText("");
                      Toast.makeText(this,n>0?("Добавлено слов: "+n+(bad>0?" · пропущено: "+bad:"")):"Ничего не добавлено",Toast.LENGTH_SHORT).show();
                      renderUserWords(); renderFreq();
                  });
                  userCount=label("",13,true); userCount.setPadding(0,12,0,4); root.addView(userCount);
                  userList=new LinearLayout(this); userList.setOrientation(1); root.addView(userList);
                  TextView ft=label("Часто набираешь, но нет в словаре",13,true); ft.setPadding(0,14,0,4); root.addView(ft);
                  freqList=new LinearLayout(this); freqList.setOrientation(1); root.addView(freqList);
                  renderUserWords();
                  freqList.addView(label("Загрузка…",12,false));
                  new Thread(()->{dictEngine.loadAll(); runOnUiThread(this::renderFreq);}).start();
                  section("Удержание — независимые таймеры"); addTimer("hold500","Удержание 1 (мс)",500); addTimer("hold1000","Удержание 2 (мс)",1000);
                  section("Повтор удаления"); addDeleteRepeatSetting();
                  section("Определение физической клавиши"); Button detect=new Button(this); detect.setText("ОПРЕДЕЛИТЬ КЛАВИШУ — НАЖМИ НА НЕЁ НА ТЕЛЕФОНЕ"); root.addView(detect); detectStatus=label("Ожидание",13,false); root.addView(detectStatus); detect.setOnClickListener(v->{detecting=true;detectStatus.setText("Теперь нажми физическую клавишу Titan 2 Elite");});
                  section("Физические модификаторы");
                  root.addView(label("ALT Left — 57 · SHIFT Left — 59 · SHIFT Right — 60 · SPACE — 62 · SYM — 63 (обычная клавиша: ю / Shift+SYM: Ю). Оба SHIFT переключают заглавные буквы; SHIFT + ПРОБЕЛ меняет язык.",13,false));
                  section("Назначения клавиш"); root.addView(label("Коротко | ALT | SYM-слой (для старых назначений) | SHIFT | 0,5 сек. | 1 сек.",12,true)); rowsRoot=new LinearLayout(this); rowsRoot.setOrientation(1); root.addView(rowsRoot);
                  for(int i=0;i<CODES.length;i++) addRow(CODES[i],NAMES[i]);
                  section("Функции SHIFT"); root.addView(label("Левый и правый SHIFT работают одинаково: только заглавные буквы. SYM (код 63) по умолчанию вводит ю, с Shift — Ю. ALT — цифры и спецсимволы.",13,false));
                  Button save=new Button(this); save.setText("СОХРАНИТЬ ВСЕ НАСТРОЙКИ"); root.addView(save); save.setOnClickListener(v->{saveCurrentRows(lang);Toast.makeText(this,"Сохранено",Toast.LENGTH_SHORT).show();});
                  section("Резервная копия профиля");
                  Button export=new Button(this); export.setText("ЭКСПОРТИРОВАТЬ ПРОФИЛЬ В ФАЙЛ"); root.addView(export);
                  export.setOnClickListener(v->{saveCurrentRows(lang);Intent i=new Intent(Intent.ACTION_CREATE_DOCUMENT);i.addCategory(Intent.CATEGORY_OPENABLE);i.setType("application/json");i.putExtra(Intent.EXTRA_TITLE,"TitanKeyboard-profile.json");startActivityForResult(i,REQ_EXPORT);});
                  Button imp=new Button(this); imp.setText("ИМПОРТИРОВАТЬ ПРОФИЛЬ ИЗ ФАЙЛА"); root.addView(imp);
                  imp.setOnClickListener(v->{Intent i=new Intent(Intent.ACTION_OPEN_DOCUMENT);i.addCategory(Intent.CATEGORY_OPENABLE);i.setType("*/*");startActivityForResult(i,REQ_IMPORT);});
                  Button ime=new Button(this); ime.setText("НАСТРОЙКИ КЛАВИАТУР ANDROID"); root.addView(ime); ime.setOnClickListener(v->startActivity(new Intent(Settings.ACTION_INPUT_METHOD_SETTINGS)));
                  Button reset=new Button(this); reset.setText("СБРОСИТЬ НАЗНАЧЕНИЯ"); root.addView(reset); reset.setOnClickListener(v->new android.app.AlertDialog.Builder(this).setMessage("Сбросить все назначения?").setNegativeButton("Отмена",null).setPositiveButton("Сбросить",(d,w)->{SharedPreferences.Editor ed=p.edit();for(String k:p.getAll().keySet())if(k.startsWith("key_"))ed.remove(k);ed.apply();recreate();}).show());
              }
              @Override protected void onResume(){super.onResume();updateOverlayStatus();if(dictEngine!=null){dictEngine.reloadLearned();renderUserWords();if(dictEngine.dictsLoaded())renderFreq();}}
              private TextView chipButton(String text,int color){
                  TextView b=new TextView(this); b.setText(text); b.setTextSize(13); b.setTypeface(null,Typeface.BOLD); b.setTextColor(color);
                  b.setPadding(22,10,22,10); b.setGravity(android.view.Gravity.CENTER);
                  android.graphics.drawable.GradientDrawable g=new android.graphics.drawable.GradientDrawable();
                  g.setCornerRadius(40); g.setStroke(2,color); g.setColor(0x00000000); b.setBackground(g); return b;
              }
              private LinearLayout wordRow(String word,String extra){
                  LinearLayout row=new LinearLayout(this); row.setOrientation(0); row.setGravity(android.view.Gravity.CENTER_VERTICAL);
                  row.setPadding(16,8,8,8); row.setBackgroundColor(0xffffffff);
                  TextView t=label(word,15,false); row.addView(t,new LinearLayout.LayoutParams(0,-2,1));
                  if(extra!=null){TextView x=label(extra,12,false);x.setTextColor(0xff8a93a3);x.setPadding(0,0,16,0);row.addView(x);}
                  return row;
              }
              private void renderUserWords(){
                  if(userList==null||dictEngine==null)return;
                  userList.removeAllViews();
                  java.util.List<String> words=dictEngine.userWordList();
                  userCount.setText("В моём словаре: "+words.size());
                  if(words.isEmpty()){userList.addView(label("Пока пусто",12,false));return;}
                  for(String w:words){
                      LinearLayout row=wordRow(w,null);
                      TextView del=chipButton("✕",0xffb42318);
                      del.setOnClickListener(v->{dictEngine.removeUserWord(w);renderUserWords();renderFreq();});
                      row.addView(del);
                      LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(-1,-2); lp.bottomMargin=3; userList.addView(row,lp);
                  }
              }
              private void renderFreq(){
                  if(freqList==null||dictEngine==null||!dictEngine.dictsLoaded())return;
                  freqList.removeAllViews();
                  java.util.List<String[]> items=dictEngine.frequentUnknown(20);
                  if(items.isEmpty()){freqList.addView(label("Пока нет — такие слова появятся здесь, когда наберёшь их хотя бы 2 раза.",12,false));return;}
